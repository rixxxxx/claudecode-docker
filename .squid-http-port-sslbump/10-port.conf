# SSL-Bump-capable listener (see squid.conf's own "SSL Bump" comment).
# cert=/key= always point at a syntactically valid keypair -- the tracked
# .squid-empty-bump-ca/ placeholder by default, or the real host-generated
# CA once bin/generate-bump-ca.sh has run (see docker-compose.yml's
# SQUID_BUMP_CA_DIR). Whether anything actually gets bumped is controlled
# separately by SQUID_SSLBUMP_DIR (see squid.conf).
#
# NOT CONFIRMED WORKING as of 2026-09-18: ubuntu/squid:latest's packaged
# Squid appears to lack security_file_certgen/ssl_crtd entirely (confirmed
# absent at all three candidate paths during a real build -- see
# Dockerfile.egress-proxy's own warning). This listener will likely fail
# to start on that base image until that's resolved (different base image,
# or an additional package). Needs further investigation before relying on
# this -- see README "TLS interception" Limitations.
http_port 3128 ssl-bump cert=/etc/squid/bump-ca/ca.crt key=/etc/squid/bump-ca/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
