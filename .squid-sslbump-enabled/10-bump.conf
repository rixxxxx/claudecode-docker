# Self-contained SSL Bump activation -- see squid.conf's own comment for
# why this fragment owns the acl/ssl_bump directives entirely rather than
# squid.conf declaring a static "safe fallback" (`ssl_bump splice all`)
# itself: that would still require Squid's ssl_bump machinery to parse
# successfully even for default (non-ssl-bump) users. Only ever mounted
# when SQUID_SSLBUMP_DIR points here (bin/cc-container --ssl-bump), which
# must be combined with SQUID_HTTP_PORT_DIR -> .squid-http-port-sslbump/
# and SQUID_BUMP_CA_DIR -> the real generated CA (see docker-compose.yml)
# -- this fragment alone, without the SSL-Bump-capable http_port listener,
# would be inert (ssl_bump directives with no ssl-bump-capable port to
# apply to).
#
# LIVE-VERIFIED WORKING as of 2026-09-18 (see README "TLS interception"
# Status note for the full writeup): ubuntu/squid:latest's packaged Squid
# lacked security_file_certgen/ssl_crtd entirely, fixed by installing
# squid-openssl (see Dockerfile.egress-proxy). A full
# TEST_SSL_BUMP=1 tests/integration/test_ssl_bump.sh run confirms bumping,
# the generated CA, and this file's exfil_suspicious_url rule all work
# against a real build.
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump allowed_domains

# Illustrative starting rule, not exhaustive (same "candidate, not a
# finished ruleset" spirit as falco/claude-code-rules.yaml's own OPEN
# ITEMS): blocks requests to allowed domains whose path/query contains a
# long base64-ish run -- one concrete shape of "exfiltrate a secret via
# the URL of an otherwise-allowed request" (see falco/claude-code-rules.yaml
# OPEN ITEMS "Third pass" for the underlying threat). Only evaluated for
# bumped (decrypted) requests -- meaningless without SSL Bump active, which
# is exactly why it lives in this file and not squid.conf itself. Expect
# to refine this over time; a legitimate long token/hash in a URL will
# false-positive here.
#
# FIXED 2026-09-18 (real startup failure): Squid's acl syntax treats a
# QUOTED regex argument as a FILENAME to load patterns from, not an
# inline pattern -- confirmed live via the exact error this produced:
# "ERROR: Can not open file [A-Za-z0-9+/_-]{60,}={0,2} for reading" /
# "WARNING: empty ACL: acl exfil_suspicious_url ...", i.e. Squid tried to
# open a file literally named after the regex and silently loaded an
# empty (never-matching) ACL instead of erroring loudly. Squid's config
# parser doesn't need shell-style quoting for a pattern with no spaces --
# removed the quotes entirely rather than escaping them.
acl exfil_suspicious_url urlpath_regex -i [A-Za-z0-9+/_-]{60,}={0,2}
http_access deny exfil_suspicious_url

ssl_bump splice all
