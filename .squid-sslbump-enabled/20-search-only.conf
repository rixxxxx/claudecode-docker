# Restricts a subset of the reference-domain allowlist
# (.squid-claudecode-docker/00-defaults.conf) to their own search-query
# endpoint only -- everything else on these domains (arbitrary content
# pages, etc.) is denied. User-requested (2026-09-18): reduce these
# reference sites to "look something up," not "browse freely."
#
# Same first-match-wins ordering requirement as 10-bump.conf's
# exfil_suspicious_url rule (see squid.conf's own comment): these
# http_access lines must -- and do, via the shared sslbump/*.conf include
# point -- come before squid.conf's `http_access allow allowed_domains`.
# Only meaningful with SSL Bump active (path-level filtering needs
# decrypted requests); inert otherwise, same as this whole directory.
#
# FIXED 2026-09-18 (real, live-diagnosed failure -- see squid.conf's own
# `debug_options` breadcrumb / this repo's conversation history for the
# full trace): every domain block here originally went straight from
# `acl X_dom dstdomain ...` to the path-conditional allow/deny pair. Live
# ACL-trace debugging (`debug_options 28,9`) showed EVERY urlpath_regex ACL
# evaluating to `-1` ("indeterminate"), including a maximally broad debug
# ACL that should have trivially matched -- root cause, confirmed against
# multiple squid-users mailing list threads (one answered by a Squid core
# developer): http_access is evaluated TWICE for a bumped connection --
# once against the bare CONNECT (no HTTP path exists yet, so urlpath_regex
# can only return -1) and once against the real decrypted request
# afterward. Without an explicit `http_access allow CONNECT <domain>`
# line, the CONNECT-stage pass falls through to the unconditional
# `deny <domain>` line below it (since the path-conditional `allow` can't
# match with no path yet) and the connection is denied before Squid ever
# gets far enough to decrypt and re-evaluate against the real request --
# so the second, working pass never happened. Every block below now has
# this `allow CONNECT <domain>` line first: it only matches CONNECT-method
# requests (method GET, the real decrypted request, never satisfies it),
# so it exclusively unblocks the bump itself without granting any actual
# path access -- the real restriction still comes entirely from the
# path-conditional allow/deny pair that follows, now correctly evaluated
# against real, populated request data.
#
# Real search-URL patterns researched per domain (2026-09-18, mix of
# WebSearch-only findings and live `curl` verification against the real
# sites from outside the sandbox -- see this repo's own conversation
# history for the research trail, not reproduced here). Domains
# DELIBERATELY EXCLUDED from this file, left fully open instead, because
# they have no simple, restrictable server-side search endpoint:
#   - doc.rust-lang.org (rustdoc), devdocs.io, docs.python.org (Sphinx):
#     search is 100% client-side against a static index already served as
#     normal page content -- restricting would be either meaningless or
#     (devdocs.io) would break reading actual doc content too.
#   - react.dev, vuejs.org, angular.dev, kubernetes.io: search is a
#     client-side Algolia DocSearch widget with no dedicated search PAGE
#     on their own domain at all (it overlays on whatever page you're
#     already on) -- see the Algolia rules below instead, which restrict
#     the actual query API domain.
#   - redis.io, docs.aws.amazon.com: confirmed live (curl from a real
#     host) to be JS-SPA shells with no content in the raw HTML response
#     at the expected search path -- real backend not identified.
#   - docs.docker.com: confirmed live, `/search/?q=...` redirects to the
#     bare homepage (query dropped) -- no real search page at that path.
#   - falco.org, cloud.google.com: confirmed live, no `/search` path
#     exists at all (404).
#   - dev.mysql.com: originally included here with `/doc/search/?q=`
#     (moderate confidence, WebSearch-only finding) -- live-tested against
#     this project's own SSL-Bump test setup and confirmed WRONG: Oracle's
#     Akamai-fronted site returns a real "Technical Difficulties" error
#     page (not a bot-block -- ruled out by testing with a browser
#     User-Agent, same fix that resolved a genuine bot-block on crates.io)
#     for that path, meaning it isn't the real search endpoint. Real one
#     not identified; moved here rather than keep guessing.
#
# Anthropic/Claude Code's own domains (2026-09-19, user-requested: restrict these
# too, only to endpoints actually needed -- not a broad /v1/ guess). Unlike the
# domains above, no curl-based research is possible here (these require auth /
# aren't public search UIs) -- instead extracted directly from the installed CLI
# itself: `grep -a -o` for literal URL/path strings in
# ~/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
# (claude-code version 2.1.278 at time of writing). Cross-checked against
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 (set in docker-compose.yml), which the
# binary confirms disables plugin-marketplace downloads, "Projects" and
# "DesignSync" entirely -- their endpoints (/v1/design/*, /v1/code/*,
# /v1/filestore/*, /v1/pages/*, the /claude-code-releases/plugins/ download) are
# therefore never called in this environment and are deliberately left out below.
# /v1/metrics, /v1/logs, /v1/traces are a LOCAL server the CLI itself hosts, not
# egress traffic -- not relevant to Squid at all. Rate-limit data (5h/7d) rides on
# response headers (anthropic-ratelimit-unified-*) of the normal /v1/messages
# calls, not a separate endpoint. Re-derive this list (same grep) whenever
# CLAUDE_CODE_VERSION is bumped (see bin/update-deps.sh) -- endpoints can change
# between CLI versions.
#   - claude.com: only /docs/, /blog/, /enterprise style links found -- these are
#     text references the CLI prints for the user to open themselves, no evidence
#     of the CLI fetching them itself. Left fully open, undocumented further.
#   - mcp-proxy.anthropic.com: only the bare hostname appears, no path string at
#     all (likely per-MCP-server dynamic paths). Left fully open pending real
#     traffic-capture verification.

# Q&A / language references
acl so_dom dstdomain .stackoverflow.com
http_access allow CONNECT so_dom
acl so_search urlpath_regex ^/search\?q=
http_access allow so_dom so_search
http_access deny so_dom

acl sx_dom dstdomain .stackexchange.com
http_access allow CONNECT sx_dom
acl sx_search urlpath_regex ^/search\?q=
http_access allow sx_dom sx_search
http_access deny sx_dom

# developer.mozilla.org (MDN): the /{locale}/search?q= page is a static
# shell that fires an XHR to the self-hosted /api/v1/search endpoint (same
# host, Django+Elasticsearch -- NOT Algolia despite MDN's historical use
# of it) -- both paths need to be allowed for search to actually work.
acl mdn_dom dstdomain .developer.mozilla.org
http_access allow CONNECT mdn_dom
acl mdn_search urlpath_regex ^/[a-zA-Z-]+/search(\?|$)
acl mdn_api urlpath_regex ^/api/v1/search
http_access allow mdn_dom mdn_search
http_access allow mdn_dom mdn_api
http_access deny mdn_dom

acl godev_dom dstdomain .pkg.go.dev
http_access allow CONNECT godev_dom
acl godev_search urlpath_regex ^/search\?q=
http_access allow godev_dom godev_search
http_access deny godev_dom

# learn.microsoft.com: query param is `terms`, not `q` -- confirmed via
# Microsoft's own community docs on this URL scheme.
acl msdocs_dom dstdomain .learn.microsoft.com
http_access allow CONNECT msdocs_dom
acl msdocs_search urlpath_regex ^/search/\?terms=
http_access allow msdocs_dom msdocs_search
http_access deny msdocs_dom

# Package registries
acl pypi_dom dstdomain .pypi.org
http_access allow CONNECT pypi_dom
acl pypi_search urlpath_regex ^/search/\?q=
http_access allow pypi_dom pypi_search
http_access deny pypi_dom

# crates.io: both paths live-confirmed reachable through this rule (Via
# header shows the request reaching real origin infrastructure,
# "varnish, ... egress-proxy") -- /search?q= specifically also gets an
# empty-body 403 from crates.io's OWN infrastructure for a bare `curl`
# request (likely bot/User-Agent filtering on the HTML page, unrelated to
# this Squid rule); /api/v1/crates?q= (the SPA's real backend) doesn't
# have that problem. Both stay allowed here regardless -- a real browser
# hitting /search works fine, this is a test-tooling quirk, not a config
# one.
acl crates_dom dstdomain .crates.io
http_access allow CONNECT crates_dom
acl crates_search urlpath_regex ^/search\?q=
acl crates_api urlpath_regex ^/api/v1/crates\?
http_access allow crates_dom crates_search
http_access allow crates_dom crates_api
http_access deny crates_dom

acl npm_dom dstdomain .npmjs.com
http_access allow CONNECT npm_dom
acl npm_search urlpath_regex ^/search\?q=
http_access allow npm_dom npm_search
http_access deny npm_dom

# rubygems.org: query param is `query`, not `q`.
acl gems_dom dstdomain .rubygems.org
http_access allow CONNECT gems_dom
acl gems_search urlpath_regex ^/search\?query=
http_access allow gems_dom gems_search
http_access deny gems_dom

# packagist.org: search is the ROOT path with a `query` param, not a
# dedicated /search path -- url_regex (not urlpath_regex) isn't needed
# here since urlpath_regex already includes the query string on this
# Squid version.
acl packagist_dom dstdomain .packagist.org
http_access allow CONNECT packagist_dom
acl packagist_search urlpath_regex ^/\?query=
http_access allow packagist_dom packagist_search
http_access deny packagist_dom

# Web frameworks (react.dev/vuejs.org/angular.dev deliberately absent --
# see the file header comment)
acl django_dom dstdomain .docs.djangoproject.com
http_access allow CONNECT django_dom
acl django_search urlpath_regex ^/en/[^/]+/search/\?q=
http_access allow django_dom django_search
http_access deny django_dom

# Algolia DocSearch (react.dev/vuejs.org/angular.dev/kubernetes.io's
# actual search backend, confirmed live for angular.dev: a real request to
# l1xwt2uj7f-3.algolianet.com/1/indexes/angular_v17/query). Restricted to
# the query endpoint only -- Algolia's REST API also exposes write/admin
# operations (settings, batch writes, index management) under other paths
# on the same domains, which stay denied. Note: the search TERM itself
# travels in the POST body, not the URL -- urlpath_regex can restrict which
# API operation is reachable, not filter by query content, for this one.
acl algolia_dom dstdomain .algolia.net .algolianet.com
http_access allow CONNECT algolia_dom
acl algolia_query urlpath_regex ^/1/indexes/[^/]+/quer(y|ies)
http_access allow algolia_dom algolia_query
http_access deny algolia_dom

# Databases (dev.mysql.com deliberately absent -- see the file header
# comment: the researched path turned out wrong, real endpoint not found)
# postgresql.org: apex redirects to www.postgresql.org (confirmed live) --
# the .postgresql.org dstdomain (leading dot) covers both under one rule.
acl pg_dom dstdomain .postgresql.org
http_access allow CONNECT pg_dom
acl pg_search urlpath_regex ^/search/\?q=
http_access allow pg_dom pg_search
http_access deny pg_dom

# General reference (redis.io/docs.docker.com/falco.org/docs.aws.amazon.com/
# cloud.google.com deliberately absent -- see the file header comment)
acl wiki_dom dstdomain .en.wikipedia.org
http_access allow CONNECT wiki_dom
acl wiki_search urlpath_regex ^/w/index\.php\?search=
http_access allow wiki_dom wiki_search
http_access deny wiki_dom

# Anthropic/Claude Code's own domains (see file header for methodology).
#
# FIXED 2026-09-19 (real, live-diagnosed failure): both api.anthropic.com and
# platform.claude.com were missing their /api/hello and /v1/oauth/hello startup
# preflight-connectivity endpoints (confirmed via `grep -a -o` on the installed
# claude.exe: `fetch(BASE_API_URL+"/api/hello")` and
# `fetch(new URL(TOKEN_URL).origin+"/v1/oauth/hello")`, TOKEN_URL being
# platform.claude.com/v1/oauth/token) -- every --ssl-bump start denied the
# preflight check with a 403 and the CLI refused to launch at all
# ("Unable to connect to Anthropic services / Failed to connect to
# api.anthropic.com: Status 403"), before ever reaching login or a real API
# call. Both original grep passes missed these because "hello" doesn't appear
# as a literal path segment anywhere near the other endpoint strings -- it's
# built from `${origin}/v1/oauth/hello` a few lines away from BASE_API_URL/
# TOKEN_URL's own definitions, not alongside the paths themselves.
#
# FIXED 2026-09-19 (real, live-diagnosed failure, second round): after login,
# /status showed "Managed settings (remote): fetch failed (403)" and
# "Organization policy: Couldn't load (403)" -- both fetched from
# api.anthropic.com and missing from the grep pass same as /api/hello above.
# Confirmed via the installed claude.exe: managed settings come from
# `${BASE_API_URL}/api/claude_code/settings` (function returns this unless an
# enterprise-configured settings URL overrides it, not the case here) and
# policy limits from the sibling `/api/claude_code/policy_limits` constant.
# Left blocked, these gate off Remote Control, cloud sessions, /feedback, and
# any other feature that checks org policy first (see /status's own wording).
#
# FIXED 2026-09-19 (real, live-diagnosed failure, third round): /status's Usage
# tab showed "Error: Failed to load usage data" -- fetched from
# api.anthropic.com/api/oauth/usage (plain, or with ?at_wall=1&skip_spend=1 /
# ?cedar_ember=1&skip_spend=1, per the installed claude.exe's own
# plain/at_wall/cedar_ember URL table), also missed by the original grep pass.
#
# api.anthropic.com: Messages API, cost lookup, OAuth side-endpoints, WebFetch's
# domain safety check, startup connectivity preflight (/api/hello), remote
# managed settings + org policy limits, usage-tab data (/api/oauth/usage).
acl anthropic_api_dom dstdomain api.anthropic.com
http_access allow CONNECT anthropic_api_dom
acl anthropic_api_paths urlpath_regex ^/(v1/(messages(/count_tokens)?|models|organizations/spend_limits)|api/(hello|claude_code/(settings|policy_limits)|oauth/(claude_cli/(create_api_key|roles)|cri/jwks\.json|usage)|web/domain_info))(\?|$)
http_access allow anthropic_api_dom anthropic_api_paths
http_access deny anthropic_api_dom

# platform.claude.com: OAuth authorize/callback/success + token exchange, the
# buy_credits fallback when a token exchange reports an exhausted balance, and
# the startup connectivity preflight (/v1/oauth/hello).
acl platform_claude_dom dstdomain platform.claude.com
http_access allow CONNECT platform_claude_dom
acl platform_claude_paths urlpath_regex ^/(oauth/(authorize|code/(callback|success))|v1/oauth/(token|hello)|buy_credits)(\?|$)
http_access allow platform_claude_dom platform_claude_paths
http_access deny platform_claude_dom

# claude.ai: OAuth authorize + the CLI's client-metadata document (CLAUDE_AI_ORIGIN
# in the binary).
acl claude_ai_dom dstdomain claude.ai
http_access allow CONNECT claude_ai_dom
acl claude_ai_paths urlpath_regex ^/oauth/(authorize|claude-code-client-metadata)(\?|$)
http_access allow claude_ai_dom claude_ai_paths
http_access deny claude_ai_dom

# downloads.claude.ai: CLI release artifacts + model catalog. Plugin-marketplace
# downloads under /claude-code-releases/plugins/ deliberately excluded -- gated off
# entirely by CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 (see file header).
acl downloads_claude_dom dstdomain downloads.claude.ai
http_access allow CONNECT downloads_claude_dom
acl downloads_claude_plugins urlpath_regex ^/claude-code-releases/plugins/
http_access deny downloads_claude_dom downloads_claude_plugins
acl downloads_claude_paths urlpath_regex ^/(claude-code-releases(/|$)|model-catalog/v1/(catalog|schema)\.json)
http_access allow downloads_claude_dom downloads_claude_paths
http_access deny downloads_claude_dom

# code.claude.com: documentation lookup for the claude-code-guide-agent (see
# .squid-claudecode-docker/00-defaults.conf's own comment on this domain).
acl code_docs_dom dstdomain code.claude.com
http_access allow CONNECT code_docs_dom
acl code_docs_paths urlpath_regex ^/docs/
http_access allow code_docs_dom code_docs_paths
http_access deny code_docs_dom
