# Custom Falco config for the security-monitor sidecar (see
# Dockerfile.security-monitor). Based on Falco's documented defaults, with
# these changes:
#   - engine.kind: modern_ebpf -- no kernel module build, no --privileged.
#   - program_output: enabled, pipes each alert to falco-notify.sh (native
#     desktop notification via the host's D-Bus session bus).
#   - rules_files: adds claude-code-rules.yaml alongside the bundled default
#     ruleset.
#
# Verified against a live build (Falco 0.39.2, 2026-09-11): engine.kind,
# modern_ebpf, program_output and both rules files all pass schema
# validation. Two corrections from the original doc-only draft:
#   - the key is `rules_files` (plural) -- `rules_file` (singular) is
#     deprecated in 0.39.x (warns, still works) and is a hard
#     schema-validation failure as of 0.40.0 (see falcosecurity/falco#3296).
#   - top-level `outputs: {rate, max_burst}` was removed from Falco's config
#     entirely in a breaking change before 0.39 (see
#     falcosecurity/falco#2763) -- there is no replacement key for this at
#     the top level (distinct from the still-valid
#     syscall_event_drops.rate/max_burst, which this repo doesn't set).

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/rules.d

engine:
  kind: modern_ebpf
  modern_ebpf:
    cpus_for_each_buffer: 2

time_format_iso_8601: true

json_output: false
json_include_output_property: true

log_stderr: true
log_syslog: false
log_level: info

priority: debug

buffered_outputs: false

syslog_output:
  enabled: false

file_output:
  enabled: false

stdout_output:
  enabled: true

# Pipes each alert to falco-notify.sh, which turns it into a native
# desktop notification via the host's D-Bus session bus (see
# docker-compose.yml's security-monitor service for the bind mount).
program_output:
  enabled: true
  keep_alive: false
  program: "/usr/local/bin/falco-notify.sh"

http_output:
  enabled: false

grpc:
  enabled: false

grpc_output:
  enabled: false

metadata_download:
  max_mb: 100
  chunk_wait_us: 1000
  watch_freq_sec: 1
