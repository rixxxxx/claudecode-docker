# Custom Falco config for the security-monitor sidecar (see
# Dockerfile.security-monitor). Based on Falco's documented defaults, with
# these changes:
#   - engine.kind: modern_ebpf -- no kernel module build, no --privileged.
#   - program_output: enabled, pipes each alert to falco-notify.sh (native
#     desktop notification via the host's D-Bus session bus).
#   - rules_files: adds claude-code-rules.yaml alongside the bundled default
#     ruleset.
#
# Verified against a live build (Falco 0.39.2, 2026-09-11): engine.kind,
# modern_ebpf, program_output and both rules files all pass schema
# validation. Two corrections from the original doc-only draft:
#   - the key is `rules_files` (plural) -- `rules_file` (singular) is
#     deprecated in 0.39.x (warns, still works) and is a hard
#     schema-validation failure as of 0.40.0 (see falcosecurity/falco#3296).
#   - top-level `outputs: {rate, max_burst}` was removed from Falco's config
#     entirely in a breaking change before 0.39 (see
#     falcosecurity/falco#2763) -- there is no replacement key for this at
#     the top level (distinct from the still-valid
#     syscall_event_drops.rate/max_burst, which this repo doesn't set).
#   - `metadata_download` (k8s/container metadata enrichment download
#     tuning) is also schema-invalid on 0.39.2 -- removed entirely rather
#     than chasing its replacement key, since this container has no use for
#     it anyway: security-monitor runs with network_mode: none (see
#     docker-compose.yml), so any feature that tries an actual network
#     fetch has no network stack to use. Suspected (not fully confirmed) of
#     causing Falco to hang during startup rather than fail fast -- on a
#     real host, the process got past "Opening 'syscall' source"/"One ring
#     buffer" (confirmed via bpftool: ringbuf maps did get created,
#     matching cpus_for_each_buffer) but then never processed a single
#     event afterwards, with no error printed either.
#
# Updated 2026-09-15 for the jump from Falco 0.39.2 to 0.44.1 (base image
# switched from the retired falcosecurity/falco-no-driver to
# falcosecurity/falco:latest-debian, see Dockerfile.security-monitor's own
# comment). Three more breaking changes hit, two on first boot and one on
# a second pass after fixing the first:
#   - the `grpc:` key (previously below, `enabled: false`) no longer
#     exists in the config schema at all -- removed entirely rather than
#     guessing a replacement.
#   - `grpc_output:` (previously below, `enabled: false`) turned out to
#     ALSO no longer exist -- Falco's schema validator only reported one
#     invalid key at a time, so this one only surfaced after removing
#     `grpc:` and reloading. Confirmed against the current
#     falcosecurity/falco master falco.yaml, which has no `grpc*` keys of
#     any kind -- removed entirely too.
#   - container enrichment (container.id/container.name/etc., which nearly
#     every rule in claude-code-rules.yaml depends on via the
#     claude_code_container macro) moved out of Falco's core into a
#     separate `container` plugin at some point between 0.39 and 0.44 --
#     Falco now hard-fails at startup ("Plugin requirement not satisfied,
#     must load one of: container (>= 0.4.0)") unless it's explicitly
#     loaded. Added `load_plugins`/`plugins` below matching the current
#     upstream example config exactly (library_path: libcontainer.so,
#     shipped in the falco:latest-debian image).

rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/rules.d

engine:
  kind: modern_ebpf
  modern_ebpf:
    cpus_for_each_buffer: 2

time_format_iso_8601: true

json_output: false
json_include_output_property: true

log_stderr: true
log_syslog: false
log_level: info

priority: debug

buffered_outputs: false

syslog_output:
  enabled: false

file_output:
  enabled: false

stdout_output:
  enabled: true

# Pipes each alert to falco-notify.sh, which turns it into a native
# desktop notification via the host's D-Bus session bus (see
# docker-compose.yml's security-monitor service for the bind mount).
program_output:
  enabled: true
  keep_alive: false
  program: "/usr/local/bin/falco-notify.sh"

http_output:
  enabled: false

load_plugins: [container]

plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false
