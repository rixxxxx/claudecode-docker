#
# Fixed 2026-09-14 (proc.name-spoofing gap, found by cross-referencing
# BlackBerry's "Falco-bypasses" writeup -- technique (c), "Executable-Naming"
# -- against this repo's own rules, not discovered independently): "Unexpected
# shell" and "Non-Claude read of ~/.claude credentials" both used to exclude
# on `proc.pname`/`proc.name in (claude, node)` as an OR alongside the
# pexepath hardening, not an AND. A from-birth-renamed attacker binary
# (`cp attacker /tmp/node && /tmp/node`, comm=node at execve time, no
# prctl() call involved) satisfied the pname branch alone and bypassed the
# exepath check entirely -- and "Process impersonating trusted name via
# prctl" didn't catch it either, since that rule only reacts to an actual
# prctl(PR_SET_NAME) syscall, never a process simply named that way from
# exec. Fixed by hardening the "node" exclusion via its own exepath too
# (new node_binary_exepath/node_binary_pexepath macros, real path
# /usr/local/bin/node -- fixed by the official Node tarball install in
# Dockerfile, not npm-prefix-dependent like claude.exe's) instead of
# dropping the name-based exclusion outright, since npm genuinely does run
# lifecycle scripts as `sh -c "..."` with the real node process as parent
# (confirmed live via the earlier `nc -> sh -> node` ancestor chain, see
# "Fixed 2026-09-13" above) -- removing the exclusion entirely would have
# made every `npm install` with a lifecycle script false-positive
# "Unexpected shell". `claude` was dropped from both name lists entirely
# (never observed as the real CLI's comm, which is always "Bun"/"Bun Pool
# N"). "Process impersonating trusted name via prctl" also gated on
# node_binary_exepath now, for symmetry (purely theoretical currently, no
# observed legitimate case). Verified live via
# tests/security/test_falco_rules.sh's
# test_unexpected_shell_catches_renamed_impersonator (bypass now caught)
# and the added assert_alert_absent check inside
# test_network_tool_during_npm_install (real npm lifecycle-script shell
# still correctly excluded, no new false positive).
