# Custom Falco rules scoped to this repo's claude-code container. Loaded
# in addition to Falco's bundled default ruleset (see falco/falco.yaml's
# rules_file). See README "Runtime monitoring (optional)" and AGENTS.md.
#
# Matches on container.image.repository, not container.name: this repo's
# claude-code container names are dynamic per workspace
# (derive_compose_project_name() in bin/cc-container), but the image is
# always claude-code:latest (see AGENTS.md "Multi-instance invariants").
#
# Confirmed on a real host: without a docker.sock mount, Falco can't
# resolve container.image.repository or container.name at all (every event
# shows container_name=<NA>) -- so the container.image.repository match
# below never fired and these three rules were dead. Matching on UID
# instead: claude-code is the only service in this repo that runs as UID
# 1000 (Dockerfile: `useradd -u 1000 claudecode`) -- egress-proxy's Squid
# runs as UID 13 (proxy), proxy-auth's entrypoint runs as root. excluding
# container.id=host keeps this from also matching a host-level UID-1000
# process outside any container.

- macro: claude_code_container
  condition: (user.uid = 1000 and container.id != host)

- rule: Unexpected shell in claude-code
  desc: >
    An interactive shell was spawned inside the claude-code container.
    Claude Code itself doesn't spawn interactive sub-shells from its own
    code -- this is typical of a compromised postinstall hook or an
    attempted reverse shell.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name in (bash, sh, dash, zsh, ash)
    and not proc.pname in (claude, node)
  output: >
    Shell spawned in claude-code
    (command=%proc.cmdline parent=%proc.pname user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, shell]

- rule: Write attempt to workspace Squid override in claude-code
  desc: >
    A write was attempted against /workspace/.squid-claudecode-docker
    inside claude-code. This path is intentionally mounted read-only (see
    AGENTS.md "Per-workspace .squid-claudecode-docker overrides") -- a
    write attempt here means something tried to widen its own network
    policy from inside the sandbox. Detection-side counterpart to the hard
    enforcement test in tests/security/test_runtime_hardening.sh.
  condition: >
    open_write
    and claude_code_container
    and fd.name startswith /workspace/.squid-claudecode-docker
  output: >
    Write attempt to read-only Squid override in claude-code
    (file=%fd.name command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, filesystem]

- rule: Outbound connection from claude-code not via egress-proxy
  desc: >
    claude-code attempted an outbound TCP connection to a port other than
    egress-proxy's 3128. Given this repo's network topology (internal:
    true, no default gateway -- see docker-compose.yml), such an attempt
    should never succeed, but the attempt itself indicates code trying to
    bypass HTTP_PROXY/HTTPS_PROXY rather than the domain allowlist being
    insufficient -- worth knowing about either way (defense-in-depth
    tripwire).
  condition: >
    (evt.type = connect and evt.dir = <)
    and claude_code_container
    and fd.l4proto = tcp
    and fd.rport != 3128
  output: >
    Outbound connection attempt from claude-code bypassing egress-proxy
    (dest=%fd.rip:%fd.rport command=%proc.cmdline user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, network]

# TEST-ONLY: not a security signal. Confirms the security-monitor pipeline
# end to end (rule match -> stdout log -> program_output -> falco-notify.sh
# -> desktop notification) with a single harmless, unambiguous trigger, so
# a "why didn't rule X fire" investigation can first rule out "the pipeline
# itself is broken" before debugging a specific rule's condition. Safe to
# delete this block any time -- it lives only here, no Dockerfile/Compose
# change depends on it.
#
# Trigger (inside the claude-code container):
#   touch /tmp/falco-pipeline-test
# Expect: a "TEST ALERT" line in `docker compose logs -f security-monitor`
# and a desktop notification. Clean up afterwards with:
#   rm /tmp/falco-pipeline-test
- rule: TEST - Falco pipeline sanity check
  desc: >
    Test-only rule with no security meaning. Confirms Falco's rule
    matching, stdout log output, and program_output/notify-send path are
    all working, via one specific harmless command.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name = touch
    and proc.args contains "falco-pipeline-test"
  output: >
    TEST ALERT - Falco pipeline is working
    (command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, test]
