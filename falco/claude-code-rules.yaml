#
# More candidates, from a second pass over public Falco-bypass research
# (2026-09-14, sources: armosec/curing, MatheuZSecurity/Furtex,
# Detect-DefenseLab/CVE-2026-31431-detection-defense, mrtc0's
# blog.ssrf.in "How to Bypass Falco" writeup, falcosecurity/falco security
# advisories GHSA-rfgw-vmxp-hp5g/GHSA-6v9j-2vm2-ghf7/GHSA-7cq5-h4p2-h37p) --
# relevance assessed against THIS repo's actual architecture, not generic:
#   - io_uring (io_uring_setup/io_uring_enter/io_uring_register) --
#     fundamental architectural blind spot: operations submitted via
#     io_uring's shared ring buffer never hit the sys_enter_* tracepoints
#     Falco's modern_ebpf driver hooks, so file access/writes/connects done
#     this way are invisible regardless of which rule conditions exist.
#     Not fixable by adding a rule -- needs Falco's KRSI-based io_uring
#     plugin (falcosecurity/falco advisory GHSA-7cq5-h4p2-h37p, tracked
#     upstream, not something this repo can build around on its own). No
#     custom seccomp profile is set anywhere in this repo (confirmed via
#     grep) -- claude-code runs Docker's default seccomp profile, whose
#     io_uring syscall blocklist varies by Docker version on the host.
#     Whether io_uring_setup even succeeds inside claude-code as currently
#     configured is unverified -- check this FIRST before anything else in
#     this entry, since if it's already blocked at the seccomp layer the
#     rest is moot here.
#   - proc.name-spoofing / path-pivot techniques cataloged in
#     MatheuZSecurity/Furtex ("Axis B" of its Falco-specific bypasses) --
#     same class of bug as the 2026-09-14 proc.pname="node"/"claude" fix
#     above (found independently via BlackBerry's older writeup), Furtex
#     just catalogs many more instances of it. Worth a systematic sweep of
#     every proc.name/proc.pname-based exclusion left in this file for the
#     same pattern, not just the two already fixed.
#   - Furtex's BPF-map-manipulation/EDR-evasion axis -- lower relevance to
#     THIS architecture specifically than generically advertised:
#     security-monitor runs in a separate container with its own elevated
#     capabilities (SYS_ADMIN/SYS_PTRACE/DAC_OVERRIDE) that claude-code
#     does NOT have (no cap_add there) and a separate network/PID
#     namespace -- a compromised claude-code process has no direct path to
#     security-monitor's own eBPF maps the way this technique generally
#     assumes (same container/namespace as the observer). Not zero risk,
#     just not the primary concern here the way it would be for a Falco
#     deployment observing its own namespace.
#   - SCM_RIGHTS fd-passing breaking Falco's process-level FD tracking, and
#     count-based rules defeated by socket reuse (both from
#     Detect-DefenseLab/CVE-2026-31431-detection-defense) -- these are
#     Falco ENGINE limitations, not something a rule change in this file
#     can fix. Belongs conceptually with "Known, deliberately NOT closed"
#     above once/if confirmed against 0.39.2, not really a "future rule to
#     design".
# Fixed 2026-09-14: `/proc/self/root` path-normalization bypass (candidate
# from mrtc0's blog.ssrf.in/tags/falco/ writeup, confirmed live against
# this repo's own rules rather than assumed). Not quite the same mechanism
# mrtc0 described -- Falco didn't normalize `/proc/self/root/...` down to
# drop the `root` segment on this build (0.39.2); instead it reported
# fd.name as the literal, unresolved syscall argument (kept the full
# `/proc/self/root/` prefix), confirmed via a throwaway DEBUG rule to be
# the exact same underlying file (matching dev/ino against the direct-path
# baseline). Same practical bypass either way: any fd.name exact-
# match/startswith condition fails regardless of which normalization bug
# causes it. Affected both "Non-Claude read of ~/.claude credentials"
# (fixed: exact match -> `endswith "/.claude/.credentials.json"`) and
# "Write attempt to workspace Squid override" (fixed: `startswith` ->
# `contains "/.squid-claudecode-docker"`) -- both now immune to whatever
# prefix is used to reach the path. Verified live via
# tests/security/test_falco_rules.sh's
# test_credentials_read_via_proc_self_root_fires and
# test_squid_override_write_via_proc_self_root_fires.
#
# Maintenance trap, addressed 2026-09-14: /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
# is this host's actual observed install path, not something
# pinned/guaranteed by the Dockerfile. It used to be duplicated as a literal
# in three rules' conditions; now centralized into the
# claude_code_binary_exepath / claude_code_binary_pexepath macros (defined
# near the pexepath-hardening comment above) so a path change is a one-line
# (well, two-line) edit instead of three. Deliberately NOT loosened to a
# glob suffix match (e.g. "*/node_modules/@anthropic-ai/claude-code/bin/claude.exe")
# -- /home/claudecode is owned by the same UID 1000 the CLI itself runs as,
# so a glob anchor would let an attacker with code exec inside the container
# create a matching fake path and spawn an excluded shell under it, defeating
# the exact reason proc.pexepath hardening exists (proc.name is spoofable,
# see comment above; a loose path anchor would be too). Instead, if the npm
# global prefix or install method ever changes, tests/security/test_falco_rules.sh's
# claude-exe-path-anchor check now fails loudly by comparing this literal
# against the real installed path on the image -- silent drift (fail toward
# false positives, the safer failure mode, but still silent) is now a loud,
# fixable CI failure instead.
#
# Matches on container.image.repository, not container.name: this repo's
# claude-code container names are dynamic per workspace
# (derive_compose_project_name() in bin/cc-container), but the image is
# always claude-code:latest (see AGENTS.md "Multi-instance invariants").
#
# Confirmed on a real host: without a docker.sock mount, Falco can't
# resolve container.image.repository or container.name at all (every event
# shows container_name=<NA>) -- so the container.image.repository match
# below never fired and these three rules were dead.
#
# Matching on user.name instead of user.uid: an earlier version of this
# macro matched user.uid = 1000, reasoning that claude-code is the only
# service in this repo running as UID 1000. Confirmed false on a real host:
# a `docker compose build` invoked by a host user whose own UID also
# happens to be 1000 (a very common default for the first non-root Linux
# user) runs its RUN steps in their own namespace (container.id != host
# too), so it matched this macro and got misattributed as claude-code
# activity (the log showed these events as user=<host username>, not
# user=claudecode). Falco already resolves user.name correctly and
# differently for the two (confirmed on the same log) -- matching on the
# literal account name the Dockerfile creates (`useradd -u 1000
# claudecode`) instead of the numeric UID disambiguates this without
# needing a docker.sock mount (see AGENTS.md/README for why that's
# deliberately not an option).

- macro: claude_code_container
  condition: (user.name = claudecode and container.id != host)

# Confirmed on a real host (2026-09-11): the claude-code CLI's actual
# process/thread name is "Bun" (and "Bun Pool N" for its worker threads) --
# it's a Bun-runtime binary, not literally named "claude" or "node". Its
# real, concrete executable is /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe (an
# ELF binary, confirmed via `file`/hexdump on a real host -- claude-code
# ships as a Bun-compiled single-file executable, not a script; no
# separate "bun" binary exists anywhere on the image). "node" is kept in
# the name exclusion anyway (harmless, costs nothing -- some code paths or
# a future Claude Code build might still show up as "node").
#
# proc.pname alone is spoofable (any process can rename itself via
# prctl(PR_SET_NAME, ...), see "Unexpected shell" comment history). Hardened
# with proc.pexepath (Parent Process Executable Path, confirmed real field
# in falcosecurity/libs' sinsp_filtercheck_thread.cpp) instead of trying to
# check the parent's exe-layer (no such field exists) -- this can't be
# spoofed by renaming: an attacker can make their process's comm say
# "Bun", but not make the kernel report a different file as their actual
# executable. Confirmed both directions on a live host 2026-09-14 (both
# the docker-compose-exec true positive and the real-Bash-tool-call
# false-positive question) -- see OPEN ITEMS above for the dated writeup.
#
# Centralized 2026-09-14 (see "Maintenance trap" above): the claude.exe path
# used to be duplicated as a literal in three rules' conditions. Two macros
# below are the single point of truth now -- change the path in exactly
# these two places, not in the rules themselves. Two macros, not one,
# because proc.exepath (own process) and proc.pexepath (parent process) are
# different fields; a macro can't parametrize which field it checks.
# tests/security/test_falco_rules.sh has a companion check that fails loudly
# if this literal ever drifts from the real installed path on the image,
# instead of the rules silently stopping to exclude legitimate activity.
- macro: claude_code_binary_exepath
  condition: (proc.exepath = /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe)

- macro: claude_code_binary_pexepath
  condition: (proc.pexepath = /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe)

# Added 2026-09-14 (closing a proc.name-spoofing gap -- see the "Unexpected
# shell"/credentials-read rules' own comments for the full writeup): the
# real Node.js binary, from the official upstream tarball
# (Dockerfile: `tar -C /usr/local --strip-components=1`), always at
# /usr/local/bin/node -- a fixed, Dockerfile-guaranteed path, unlike
# claude.exe's npm-prefix-dependent one above. Lets rules exclude
# legitimate node-parented activity (e.g. npm running a `sh -c` lifecycle
# script, comm=node) via the kernel-resolved executable instead of the
# spoofable proc.name/proc.pname string.
- macro: node_binary_exepath
  condition: (proc.exepath = /usr/local/bin/node)

- macro: node_binary_pexepath
  condition: (proc.pexepath = /usr/local/bin/node)
#
# Deliberately placed here, BEFORE "Unexpected shell" below, instead of
# near the other history rules further down. Confirmed live 2026-09-13
# (Falco 0.39.2): Falco reports only ONE alert per matching event here --
# the first rule that matches, in load order (bundled falco_rules.yaml
# first, then this file top-to-bottom) wins; any other rule whose
# condition also matches the same underlying event stays completely
# silent, no matter how specific or how high its own priority is. This
# rule and "Unexpected shell" both match the exact same `bash -c
# 'unset HISTFILE'` spawned_process event -- with this rule defined AFTER
# "Unexpected shell" (its original position), "Unexpected shell" always
# won and this rule never fired at all, even though its condition was
# demonstrably true (verified via `falco --validate`, which found no
# load errors, and via "Unexpected shell"'s own %proc.cmdline output
# confirming the string "HISTFILE" was present). Moving it here so the
# more specific defense-evasion signal wins instead of being silently
# swallowed by the generic shell-spawn tripwire; "Unexpected shell" still
# fires normally for every OTHER bash/sh/dash/zsh/ash spawn that doesn't
# also match this rule's cmdline check. See the OPEN ITEMS header for the
# full writeup -- if you add a new rule whose condition can overlap with
# an existing rule's on the same event type, its position relative to that
# rule now matters and needs the same deliberate thought.
- rule: Shell history disabling command in claude-code
  desc: >
    A command was run inside claude-code to clear or disable shell history
    tracking -- classic cover-your-tracks behavior after a compromise, not
    something claude-code's own normal operation does.
  condition: >
    spawned_process
    and claude_code_container
    and (proc.cmdline contains "history -c" or proc.cmdline contains "HISTFILE")
  output: >
    Shell history disabling command in claude-code
    (command=%proc.cmdline user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, defense-evasion]

# Closed 2026-09-14 (proc.name-spoofing gap, found by cross-referencing
# BlackBerry's "Falco-bypasses" writeup against this repo's own rules): the
# condition used to also exclude on the raw `proc.pname in (claude, node)`
# string -- an OR alongside the pexepath check, not an AND, so a
# from-birth-renamed attacker binary (`cp attacker /tmp/node && /tmp/node`,
# comm=node at execve time, no prctl() involved at all) satisfied the
# pname branch alone and bypassed the pexepath hardening entirely. Neither
# the pexepath check nor "Process impersonating trusted name via prctl"
# (which only reacts to an actual prctl(PR_SET_NAME) syscall, never fires
# for a process that's simply named that way from exec) caught this.
# Fixed by hardening BOTH trusted parents via their real exepath instead
# of dropping the exclusion outright: `claude` was removed from the name
# list entirely (never observed as the real CLI's comm, which is always
# "Bun"/"Bun Pool N" -- see below), and `node` -- genuinely needed, since
# npm always runs lifecycle scripts as `sh -c "..."` with the real node
# process as parent (comm=node), confirmed live via the
# `nc -> sh -> node` ancestor chain in the OPEN ITEMS "Fixed 2026-09-13"
# entry -- is now excluded via node_binary_pexepath (the real,
# Dockerfile-guaranteed /usr/local/bin/node) instead of the spoofable
# name string. See tests/security/test_falco_rules.sh for both the
# bypass-now-caught test and the npm-lifecycle-script no-false-positive
# regression guard.
- rule: Unexpected shell in claude-code
  desc: >
    An interactive shell was spawned inside the claude-code container.
    Claude Code itself doesn't spawn interactive sub-shells from its own
    code -- this is typical of a compromised postinstall hook or an
    attempted reverse shell.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name in (bash, sh, dash, zsh, ash)
    and not (claude_code_binary_pexepath or node_binary_pexepath)
  output: >
    Shell spawned in claude-code
    (command=%proc.cmdline parent=%proc.pname user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, shell]

# Fixed 2026-09-14 (root-caused via a throwaway DEBUG rule on a live
# Docker/eBPF host): the original condition used the bundled `open_write`
# macro, which (confirmed by capturing the real event) requires fd.num>=0
# -- i.e. a successfully opened, valid file descriptor. A write against
# this read-only mount fails with EROFS before that, so fd.num stays -1
# and open_write never becomes true, regardless of the path. The initial
# theory (fd.name is <NA> here, same class of bug as the unlink/unlinkat
# fix above) turned out to be wrong for THIS event type: the captured exit
# event (evt.dir=<) showed fd.name correctly populated
# (/workspace/.squid-claudecode-docker/security-test-write-attempt) and
# rawres=-30 (EROFS) even though fd.num=-1 -- Falco resolves fd.name from
# the syscall's path argument here, not from a live fd-table entry. Fix:
# dropped the open_write macro entirely, match directly on the open-family
# syscall's exit event with write-intent flags (present in evt.args on
# both the enter and exit event, confirmed via the same capture) and
# fd.name -- neither requires fd.num>=0. evt.dir=< also incidentally
# avoids double-firing on the paired enter event (fd.name is <NA> there,
# so it can't match this condition anyway, but being explicit is safer
# than relying on that side effect if a future Falco version changes it).
# Verified live: a failing `touch` against this path now fires the alert
# (see tests/security/test_falco_rules.sh).
#
# Closed 2026-09-14 (same path-normalization bypass as the credentials-read
# rule, see that rule's comment for the full writeup): `fd.name startswith
# /workspace/.squid-claudecode-docker` never fired for `touch
# /proc/self/root/workspace/.squid-claudecode-docker/...` -- confirmed via
# a throwaway DEBUG rule that Falco reports fd.name as the literal,
# unresolved syscall argument (keeping the /proc/self/root/ prefix) rather
# than canonicalizing through the magic-link, so `startswith` never
# matched even though the write was correctly still blocked at the
# filesystem level (EROFS either way). Fixed by matching on `contains`
# instead of `startswith` -- immune to whatever prefix was used to reach
# the path.
- rule: Write attempt to workspace Squid override in claude-code
  desc: >
    A write was attempted against /workspace/.squid-claudecode-docker
    inside claude-code. This path is intentionally mounted read-only (see
    AGENTS.md "Per-workspace .squid-claudecode-docker overrides") -- a
    write attempt here means something tried to widen its own network
    policy from inside the sandbox. Detection-side counterpart to the hard
    enforcement test in tests/security/test_runtime_hardening.sh. Matches
    on write-intent flags, not just any open, because this path is
    deliberately readable (claude-code can see its own effective policy,
    just never change it) -- only write attempts should alert here.
  condition: >
    claude_code_container
    and evt.type in (open, openat, openat2)
    and evt.dir = <
    and (evt.args contains "O_WRONLY" or evt.args contains "O_RDWR" or evt.args contains "O_CREAT" or evt.args contains "O_TRUNC")
    and fd.name contains "/.squid-claudecode-docker"
  output: >
    Write attempt to read-only Squid override in claude-code
    (file=%fd.name result=%evt.rawres command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, filesystem]

- rule: Outbound connection from claude-code not via egress-proxy
  desc: >
    claude-code attempted an outbound TCP connection to a port other than
    egress-proxy's 3128. Given this repo's network topology (internal:
    true, no default gateway -- see docker-compose.yml), such an attempt
    should never succeed, but the attempt itself indicates code trying to
    bypass HTTP_PROXY/HTTPS_PROXY rather than the domain allowlist being
    insufficient -- worth knowing about either way (defense-in-depth
    tripwire).
  condition: >
    (evt.type = connect and evt.dir = <)
    and claude_code_container
    and fd.l4proto = tcp
    and fd.rport != 3128
  output: >
    Outbound connection attempt from claude-code bypassing egress-proxy
    (dest=%fd.rip:%fd.rport command=%proc.cmdline user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, network]

# Originally scoped to all of /home/claudecode/.claude/ minus a growing
# exclusion list (statusline.py, settings.json) -- abandoned after two
# real false-positive rounds on a live host (2026-09-11):
#   - Claude Code reads plenty of its own operational files under here as
#     part of completely normal use: CLAUDE.md/RTK.md (memory), sessions/
#     *.json and projects/*.jsonl (session transcripts), plugins/backups
#     dirs, mcp-needs-auth-cache.json -- none of these are secrets, and
#     hardcoding an exception for each one as they turn up doesn't scale.
#   - Claude Code's own Bash-tool mechanism sources
#     shell-snapshots/snapshot-*.sh via a `bash -c` wrapper before running
#     a command (to restore shell state) -- the reading process there is
#     literally "bash", which isn't in any claude/node/Bun exclusion list
#     at all, and never will be without also un-excluding real reverse
#     shells.
#   - proc.is_exe_upper_layer=false (tried as a spoofing-resistant
#     addition to the name check) also false-positived: on this host,
#     claude-code's own CLI turned out to be upper-layer (likely npm
#     self-updated at container runtime rather than baked into the image
#     at build time), so legitimate Bun activity has
#     is_exe_upper_layer=true too -- this field doesn't reliably
#     distinguish "legitimate but runtime-updated" from "foreign
#     binary".
# Narrowed instead to the one file that's actually a secret -- the OAuth
# credentials file itself (confirmed real filename from the first
# false-positive round: /home/claudecode/.claude/.credentials.json). This
# sidesteps the whack-a-mole problem above. For the remaining spoofing gap
# (proc.name is self-reported, any process can rename itself to "Bun"),
# hardened with proc.exepath instead: the real claude-code CLI is a
# Bun-compiled single-file ELF executable at
# /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe (confirmed on a real host --
# `file`/hexdump showed an ELF header, and no separate "bun" binary exists
# anywhere on the image, so this path is what actually backs every
# process that shows up as "Bun"). Unlike proc.name/is_exe_upper_layer,
# this can't be spoofed by renaming or by a runtime npm update -- it's the
# actual file the kernel resolved when the process was exec'd.
#
# Closed 2026-09-14 (same proc.name-spoofing gap as "Unexpected shell",
# see that rule's comment for the full writeup): `proc.name in (claude,
# node)` used to be an OR alongside claude_code_binary_exepath, letting a
# from-birth-renamed binary (comm=node at execve, never calling prctl)
# read this file undetected. Now excludes via node_binary_exepath (the
# real /usr/local/bin/node) instead of the spoofable name; `claude` was
# dropped from the name list entirely (never observed as the real CLI's
# comm).
# Closed 2026-09-14 (path-normalization bypass, found by cross-referencing
# mrtc0's blog.ssrf.in "How to Bypass Falco" writeup -- see OPEN ITEMS
# "More candidates" -- against this repo's own rules): the exact-match
# `fd.name = /home/claudecode/.claude/.credentials.json` condition never
# fired for `cat /proc/self/root/home/claudecode/.claude/.credentials.json`
# -- confirmed via a throwaway DEBUG rule that this reads the exact same
# file (dev=51 ino=8010218 identical to the direct-path baseline) but
# Falco reports fd.name as the literal, unresolved syscall argument
# (`/proc/self/root/home/claudecode/.claude/.credentials.json`), never
# canonicalized through the /proc/self/root magic-link. Different
# mechanism than mrtc0 described (no "root" segment gets silently
# dropped on this Falco/driver build -- the whole prefix just isn't
# resolved at all), same practical bypass. Fixed by matching on the path
# suffix instead of the full absolute path -- immune to whatever prefix
# was used to reach the file (bind mount, /proc/*/root, /proc/*/cwd,
# symlink, etc.), since the filename+parent-dir combination is specific
# enough on its own.
- rule: Non-Claude read of ~/.claude credentials in claude-code
  desc: >
    A process other than claude/node/claude-code's own CLI read the OAuth
    credentials file inside claude-code. Only relevant when the optional
    host OAuth-credential-reuse mount (docker-compose.yml's commented-out
    `${HOME}/.claude:/home/claudecode/.claude` line) is active -- that's
    when this file holds a live Claude Pro/Max login session, a
    high-value target for a compromised dependency to exfiltrate.
  condition: >
    open_read
    and claude_code_container
    and fd.name endswith "/.claude/.credentials.json"
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Non-Claude process read ~/.claude credentials in claude-code
    (file=%fd.name command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, credentials]

- rule: Privilege escalation attempt in claude-code
  desc: >
    A process inside claude-code tried to run sudo/su/pkexec/doas.
    claude-code always runs as UID 1000 (Dockerfile: `useradd -u 1000
    claudecode`) and never legitimately needs root -- any attempt is
    either a misconfigured tool or a compromised dependency trying to
    escalate. None of these binaries are installed in the base image, so
    this also catches a dependency bringing/installing its own copy.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name in (sudo, su, pkexec, doas)
  output: >
    Privilege escalation attempt in claude-code
    (command=%proc.cmdline parent=%proc.pname user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, privilege-escalation]

# Overlaps with Falco's own bundled "Delete or rename shell history" rule
# (also loaded, see falco/falco.yaml's rules_files) -- kept as a
# container-scoped duplicate anyway, for output consistent with this
# file's other rules (container/user fields, claude-code tags) and to make
# the coverage explicit rather than relying on the bundled ruleset's
# generic version. Deliberately excludes plain open_write to
# .bash_history: bash appends to it on every command/shell exit by
# default, which would make that condition fire constantly on completely
# normal use -- only actual deletion/rename or explicit
# clear/disable commands count as tampering here.
#
# Split into two separate rules 2026-09-13 (live host,
# tests/security/test_falco_rules.sh): the original single combined rule
# never fired for EITHER branch, even for a spawned_process event whose
# proc.cmdline demonstrably contained "HISTFILE" (confirmed independently
# via "Unexpected shell"'s own output for that exact event) -- mixing an
# fd.name-based file-event branch with a spawned_process-based branch via
# `or` in one rule is suspected to have broken evaluation for both
# (accessing fd.name, which isn't meaningful for a plain spawned_process
# event, appears to have poisoned the whole condition rather than that
# sub-expression cleanly evaluating false). Splitting into two independent
# rules avoids mixing event-type-scoped fields in one condition.
#
# Additionally, fd.name was independently confirmed (via a throwaway debug
# rule) to be <NA> for unlink/unlinkat events on this Falco/driver build --
# it never carries the resolved path the way plain open/read/write events
# do. Switched to evt.args (the raw formatted syscall arguments, populated
# at the syscall level regardless of fd resolution) for the file-deletion
# rule below. Best available fix given the evidence gathered; re-verify
# with tests/security/test_falco_rules.sh on the next live run.
- rule: Shell history file deleted or renamed in claude-code
  desc: >
    claude-code's shell history file was deleted or renamed -- classic
    cover-your-tracks behavior after a compromise, not something
    claude-code's own normal operation does.
  condition: >
    claude_code_container
    and evt.type in (unlink, unlinkat, rename, renameat, renameat2)
    and evt.args contains "bash_history"
  output: >
    Shell history file deleted or renamed in claude-code
    (command=%proc.cmdline args=%evt.args user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, defense-evasion]

# Three rules below adapted from falcosecurity/rules
# (https://github.com/falcosecurity/rules) -- community rule tiers not
# bundled in Falco by default (only falco_rules.yaml, the stable set, is).
# Hand-picked and rewritten against claude_code_container instead of each
# original's generic `container`/`outbound` macros, since those rely on
# container.image.repository/name resolution -- confirmed earlier in this
# file to not populate without a docker.sock mount, which this repo
# deliberately doesn't add. Verified the source conditions/lists by
# fetching the raw YAML (falco-incubating_rules.yaml,
# falco-sandbox_rules.yaml) on 2026-09-11, not by running them.

# Source: "Network Tool Executed During NPM Package Install"
# (falco-sandbox_rules.yaml). Complements the generic "Unexpected shell"
# rule above with a specific supply-chain angle: malicious npm/yarn/pnpm/
# bun packages commonly invoke a network tool from a pre/postinstall
# script to exfiltrate data or fetch a second-stage payload.
#
# Fixed 2026-09-13 (live host, tests/security/test_falco_rules.sh): "node"
# added after this rule was confirmed NOT firing for a real npm postinstall
# script invoking a network tool -- a throwaway debug rule showed the
# actual ancestor chain as `nc -> sh -> node -> sh -> containerd-shim ->
# systemd`, i.e. npm's own process reports as "node" in proc.pname/aname,
# never literally "npm" (its `process.title = 'npm'` apparently isn't
# reflected in the kernel comm field the way assumed). Trade-off, accepted:
# this broadens the rule to catch a network tool spawned from ANY
# node-ancestored process within 5 levels, not npm-specifically -- still a
# reasonable supply-chain signal (claude-code's own long-running CLI is
# itself a node/Bun process, so a legitimate reason for it to shell out to
# one of network_tool_binaries would also alarm here, mislabeled as "during
# npm install"), just less precise than originally designed.
- list: node_package_managers
  items: [npm, yarn, pnpm, bun, node]

- macro: npm_package_install_ancestor
  condition: >
    (proc.pname in (node_package_managers) or
     proc.aname[2] in (node_package_managers) or
     proc.aname[3] in (node_package_managers) or
     proc.aname[4] in (node_package_managers) or
     proc.aname[5] in (node_package_managers))

- list: network_tool_binaries
  items: [nc, ncat, netcat, nmap, dig, tcpdump, tshark, ngrep, telnet, mitmproxy, socat, zmap]

# Defense-in-depth 2026-09-14, not the primary defense anymore:
# NPM_CONFIG_IGNORE_SCRIPTS=true is now the image default (Dockerfile) --
# npm lifecycle scripts (preinstall/install/postinstall/prepare, the
# delivery mechanism this rule watches for) don't run at all for any
# package by default, preventing the attack pattern structurally instead
# of only detecting it after the fact. This rule still matters for a
# workspace that explicitly opted back in via .env
# (NPM_CONFIG_IGNORE_SCRIPTS=false, see .env.example) -- see
# tests/security/test_falco_rules.sh's
# test_npm_lifecycle_scripts_disabled_by_default (confirms the preventive
# default) and test_network_tool_during_npm_install (confirms this rule
# still fires when someone disables that default).
- rule: Network tool executed during npm install in claude-code
  desc: >
    A network tool was launched with an npm/yarn/pnpm/bun package-manager
    process somewhere in its ancestry inside claude-code.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name in (network_tool_binaries)
    and npm_package_install_ancestor
  output: >
    Network tool executed during npm install in claude-code
    (command=%proc.cmdline parent=%proc.pname gparent=%proc.aname[2] user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, network, supply-chain]

# Source: "Read environment variable from /proc files"
# (falco-incubating_rules.yaml). Relevant here because ANTHROPIC_API_KEY
# and other secrets are passed into claude-code as container environment
# variables (see docker-compose.yml) -- reading a sibling/parent process's
# /proc/<pid>/environ is a plausible way to steal them without going
# through a file at all.
#
# Confirmed on a real host (2026-09-11): plain `ps aux` reads
# /proc/<pid>/environ for every process it lists -- a completely routine,
# harmless command, but without the exclusion below it fired one alert per
# listed PID on every single `ps aux` call. Excluding known process-listing
# tools by name, same pattern as the upstream rule's own
# known_binaries_to_read_environment_variables_from_proc_files list (there
# populated with scsi_id/argoexec, irrelevant here).
- list: proc_inspection_binaries
  items: [ps, top, htop, pgrep, pidof]

- rule: Environment variables read from proc in claude-code
  desc: >
    A process read another process's environment variables via
    /proc/<pid>/environ inside claude-code.
  condition: >
    open_read
    and claude_code_container
    and fd.name glob /proc/*/environ
    and not proc.name in (proc_inspection_binaries)
  output: >
    Environment variables read from /proc in claude-code
    (file=%fd.name command=%proc.cmdline parent=%proc.pname user=%user.name container=%container.id)
  priority: WARNING
  tags: [claude-code, credentials]

# Source: "Contact cloud metadata service from container"
# (falco-incubating_rules.yaml). 169.254.169.254 serves short-lived
# instance credentials on AWS/GCP/Azure -- a compromised dependency
# reaching it is a classic credential-theft technique (MITRE T1552.005).
# Overlaps with the "not via egress-proxy" rule above (169.254.169.254 on
# port 80 isn't 3128 either, so that rule already fires too) -- kept as
# its own rule anyway for a triage-friendly, specifically-labeled alert
# instead of a generic "bypassing egress-proxy" one.
- rule: Contact cloud metadata service from claude-code
  desc: >
    claude-code attempted to contact the cloud instance metadata service.
  condition: >
    (evt.type in (connect, sendto, sendmsg) and evt.dir = <)
    and claude_code_container
    and fd.sip = "169.254.169.254"
  output: >
    Outbound connection from claude-code to cloud metadata service
    (connection=%fd.name command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, network, credentials]

# Fields verified against falcosecurity/libs source on 2026-09-11
# (driver/event_table.c: PPME_SYSCALL_PRCTL_X has args res/option/
# arg2_str/arg2_int; driver/flags_table.c: prctl_options maps "PR_SET_NAME"
# -> PPM_PR_SET_NAME; sinsp_filtercheck_thread.cpp: proc.exepath resolves
# the actual executable backing the process). Confirmed live 2026-09-14:
# `docker compose exec claude-code python3 -c "import ctypes;
# ctypes.CDLL('libc.so.6').prctl(15, b'Bun', 0, 0, 0)"` (PR_SET_NAME=15)
# fired the rule as designed --
# `exe=/usr/bin/python3.14 new_name=Bun`, correctly flagged since
# python3's exepath isn't the real claude.exe. Now covered by
# tests/security/test_falco_rules.sh's test_prctl_impersonation_fires --
# every rule in this file has at least one live-fired confirmation as of
# 2026-09-14.
#
# Originally excluded "Bun" from this rule's targets entirely: claude-code's
# own worker threads rename themselves to "Bun Pool N" constantly and
# legitimately, and an early attempt to tell real Bun apart from an
# impersonator via proc.is_exe_upper_layer=true false-positived (claude-code
# was upper-layer on this host too, likely npm self-updated at container
# runtime -- that field can't distinguish "legitimate but runtime-updated"
# from "foreign binary"). Fixed properly instead with proc.exepath: the
# real claude-code CLI is a Bun-compiled single-file ELF executable at
# /home/claudecode/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe (confirmed on a real host, no
# separate "bun" binary exists on the image) -- every legitimate "Bun"/"Bun
# Pool N" thread runs from that exact file regardless of when it was
# installed, but an attacker's process can't make the kernel report that
# file as its own executable just by renaming itself. So "Bun" is back in
# the target list below, gated on the executable NOT being the real one.
#
# Added 2026-09-14: also gated on NOT being the real node_binary_exepath,
# for symmetry with the other two rules hardened the same day -- purely
# theoretical currently (no observed case of a legitimate Node.js thread
# calling prctl(PR_SET_NAME) to rename itself to "node"/"claude"/"Bun"),
# but cheap and consistent with treating /usr/local/bin/node as a second
# trusted executable throughout this file, not just claude.exe.
- rule: Process impersonating trusted name via prctl in claude-code
  desc: >
    A process inside claude-code, running from a binary other than
    claude-code's own real executable, renamed itself via
    prctl(PR_SET_NAME) to "Bun", "claude", or "node" -- names this file's
    other rules treat as trusted. Consistent with an attacker deliberately
    trying to evade those proc.name-based exclusions.
  condition: >
    evt.type = prctl
    and evt.dir = <
    and claude_code_container
    and evt.arg.option = PR_SET_NAME
    and (evt.arg.arg2_str in (claude, node) or evt.arg.arg2_str = "Bun" or evt.arg.arg2_str startswith "Bun ")
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Process impersonating trusted name via prctl in claude-code
    (new_name=%evt.arg.arg2_str exe=%proc.exepath command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, defense-evasion]

# TEST-ONLY: not a security signal. Confirms the security-monitor pipeline
# end to end (rule match -> stdout log -> program_output -> falco-notify.sh
# -> desktop notification) with a single harmless, unambiguous trigger, so
# a "why didn't rule X fire" investigation can first rule out "the pipeline
# itself is broken" before debugging a specific rule's condition. Safe to
# delete this block any time -- it lives only here, no Dockerfile/Compose
# change depends on it.
#
# Trigger (inside the claude-code container):
#   touch /tmp/falco-pipeline-test
# Expect: a "TEST ALERT" line in `docker compose logs -f security-monitor`
# and a desktop notification. Clean up afterwards with:
#   rm /tmp/falco-pipeline-test
- rule: TEST - Falco pipeline sanity check
  desc: >
    Test-only rule with no security meaning. Confirms Falco's rule
    matching, stdout log output, and program_output/notify-send path are
    all working, via one specific harmless command.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name = touch
    and proc.args contains "falco-pipeline-test"
  output: >
    TEST ALERT - Falco pipeline is working
    (command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, test]

# TEST-ONLY: not a real security signal. Added 2026-09-14 alongside
# SECURITY_MONITOR_NOTIFY_MIN_PRIORITY specifically to test that feature --
# the two existing TEST rules above/below are both CRITICAL, so neither can
# be used to check that a below-threshold priority (NOTICE, ranked below
# the default "warning") actually gets suppressed from the popup while
# still showing up in `docker compose logs`. Safe to delete any time -- it
# lives only here, no Dockerfile/Compose change depends on it.
#
# Trigger (inside the claude-code container):
#   touch /tmp/falco-notice-test
# Expect: a "TEST ALERT" line in `docker compose logs -f security-monitor`
# always; a desktop popup only if SECURITY_MONITOR_NOTIFY_MIN_PRIORITY is
# "notice" or lower (informational/debug) -- NOT with the default
# "warning". Clean up afterwards with:
#   rm /tmp/falco-notice-test
- rule: TEST - Falco notice-priority pipeline check
  desc: >
    Test-only rule with no security meaning. Confirms
    SECURITY_MONITOR_NOTIFY_MIN_PRIORITY actually suppresses a
    below-threshold popup while `docker compose logs` still shows it, via
    one specific harmless command at NOTICE priority (below the default
    "warning" threshold).
  condition: >
    spawned_process
    and claude_code_container
    and proc.name = touch
    and proc.args contains "falco-notice-test"
  output: >
    TEST ALERT - Falco notice-priority pipeline test for claude-code
    (command=%proc.cmdline user=%user.name container=%container.id)
  priority: NOTICE
  tags: [claude-code, test]

# TEST-ONLY: not a real security signal, but unlike the pipeline-sanity
# rule above, this one's output deliberately DOES contain the literal
# substring "claude-code" -- falco-notify.sh's auto-stop counter only
# increments on messages that do (see its comment block: "Only counts
# alerts that mention claude-code in their message text ... the TEST-ONLY
# pipeline-sanity rule doesn't, which is intentional"). This rule is the
# deliberate counter-example: it exists specifically so the *auto-stop*
# path (rule match -> falco-notify.sh counter -> trigger file ->
# stop-watcher actually stopping the container, see
# stop-watcher-entrypoint.sh) can be exercised end-to-end with a harmless,
# unambiguous trigger, instead of needing to reproduce a real CRITICAL
# violation (privilege escalation, credential read, etc.) three times.
#
# Consequence, not a bug: running the trigger below
# SECURITY_MONITOR_STOP_THRESHOLD times in a row (default 3, see
# .env.example) against a live claude-code container WILL genuinely stop
# that container via stop-watcher. Only use this against a container you
# intend to have stopped. Safe to delete this block any time -- it lives
# only here, no Dockerfile/Compose change depends on it.
#
# Trigger (inside the claude-code container), repeated
# SECURITY_MONITOR_STOP_THRESHOLD times:
#   touch /tmp/falco-stop-test-trigger
# Expect: a "TEST ALERT" CRITICAL line in `docker compose logs -f
# security-monitor` each time, and after the Nth run, the claude-code
# container itself stopping (`docker compose ps` shows it exited).
# Clean up between runs / afterwards with:
#   rm -f /tmp/falco-stop-test-trigger
- rule: TEST - Falco auto-stop pipeline check
  desc: >
    Test-only rule with no security meaning. Confirms the auto-stop path
    (falco-notify.sh's CRITICAL/EMERGENCY counter and stop-watcher) works
    end to end, via one specific harmless command repeated
    SECURITY_MONITOR_STOP_THRESHOLD times.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name = touch
    and proc.args contains "falco-stop-test-trigger"
  output: >
    TEST ALERT - Falco auto-stop pipeline test for claude-code
    (command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, test]

# Added 2026-09-14 (see OPEN ITEMS "Candidate future rules" -- highest
# priority of that list): an attacker doesn't need to open
# ~/.claude/.credentials.json (the "Non-Claude read" rule above) if they
# can read the live claude-code process's memory directly instead --
# completely bypasses every file-based rule in this file. Confirmed live
# via a throwaway DEBUG rule that Falco's modern_ebpf driver on this
# version (0.39.2) does capture ptrace (only the exit event, dir=<, no
# paired enter event observed -- res/addr/data present in evt.args, no
# target-pid field). process_vm_readv/process_vm_writev assumed captured
# the same way (same driver, same event-table mechanism) but not
# separately confirmed with their own live trigger. Excluded on the same
# claude_code_binary_exepath/node_binary_exepath macros as the other
# credential-adjacent rules -- covers a legitimate Bun/node process
# ptracing itself or a child (e.g. crash-reporting/signal-handling), which
# is the only plausible legitimate use inside this container; not verified
# against a real, extended claude-code session (no live baseline capture
# of Bun's own behavior was done for this rule specifically) -- if it
# false-positives on real usage, that's the first thing to check.
- rule: Process memory access attempt in claude-code
  desc: >
    A process inside claude-code attempted to read or write another
    process's memory directly (ptrace/process_vm_readv/process_vm_writev)
    -- bypasses every file-based credential-access rule in this file,
    since the target's decrypted in-memory state is read without ever
    opening the credentials file itself.
  condition: >
    claude_code_container
    and evt.dir = <
    and evt.type in (ptrace, process_vm_readv, process_vm_writev)
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Process memory access attempt in claude-code
    (type=%evt.type args=%evt.args command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, credentials, defense-evasion]

# Added 2026-09-15 (see OPEN ITEMS "Candidate future rules" -- next item
# after ptrace/process_vm_readv/writev above; that section's preamble
# originally called this "concretely exploitable today" based on
# claude-code retaining CAP_NET_RAW in its capability BOUNDING set -- see
# the CORRECTED 2026-09-15 note there, which this rule's own testing is
# what triggered).
#
# LIVE-VERIFIED 2026-09-15 across several rounds on a real Docker/eBPF
# host (tests/security/test_falco_rules.sh, plus manual `docker compose
# exec` checks, including against a freshly `--force-recreate`d
# container). Findings, in order (each one corrected the previous):
#   1. Falco's OWN bundled ruleset (loaded before this file, see "CONFIRMED
#      2026-09-13" above re: first-match-wins) already has a rule for
#      AF_PACKET/SOCK_RAW: "Packet socket created in container" (NOTICE),
#      firing reliably (log: `socket_info=domain=17(AF_PACKET)
#      type=524291 proto=0 ...`). Since it loads first, a custom rule for
#      the same domain would never win the per-event race -- this rule
#      below does not try to cover AF_PACKET at all, by design.
#   2. The first draft's `evt.args contains "SOCK_RAW"` never matched
#      anything: Falco decodes the socket() `domain` arg symbolically
#      (`17(AF_PACKET)`) but not `type`, which prints as a raw undecoded
#      int (`524291` = `SOCK_RAW(3) | SOCK_CLOEXEC(0x80000)`, since Python
#      OR's in CLOEXEC by default) -- fixed by matching `evt.arg.type`
#      numerically instead of text-matching evt.args.
#   3. Initially misread bundled-rule firing (point 1) as proof AF_PACKET
#      raw sockets actually succeed here, unlike AF_INET/AF_INET6 (which
#      returned real EPERM/EPROTONOSUPPORT from the kernel). CORRECTED:
#      the bundled rule's condition (`evt.type=socket and evt.dir=<` plus
#      the domain check) has no success check at all -- it fires on the
#      *attempt*, exactly like this file's own ptrace rule, regardless of
#      whether the socket() call actually succeeds. Proven by running a
#      single process that printed `/proc/self/status` immediately before
#      attempting BOTH `socket(AF_PACKET, SOCK_RAW)` and
#      `socket(AF_INET, SOCK_RAW, IPPROTO_RAW)`: CapEff was
#      `0000000000000000` (all capabilities dropped from the *effective*
#      set) and BOTH calls returned EPERM, reproduced again after
#      `docker compose up -d --force-recreate claude-code` to rule out a
#      stale container. Root cause: claude-code runs as non-root (UID
#      1000, Dockerfile's `USER claudecode`) with no ambient capabilities
#      and no file capabilities on any binary -- a capability sitting in
#      Docker's default *bounding* set (`CapBnd` was non-zero and does
#      include CAP_NET_RAW) is not usable by a non-root process without
#      one of those two propagation mechanisms, neither of which this
#      project configures. So neither raw-socket domain is actually
#      creatable here, not just AF_INET -- the OPEN ITEMS preamble's
#      "concretely exploitable today" framing for raw sockets was based on
#      an incomplete reading of Linux capability semantics.
#   4. Separately, and left unresolved: even a maximally broad, completely
#      unconditioned throwaway rule (`condition: evt.type = socket`, no
#      claude_code_container filter, no domain/type check) produced ZERO
#      log lines for a plain, guaranteed-successful `AF_INET/SOCK_STREAM`
#      socket (needs no capability at all) in the persistent container --
#      meaning Falco's bundled rule firing for AF_PACKET specifically is
#      not proof that a broad `evt.type=socket` condition works in
#      general on this driver build (0.39.2, kernel 6.8.0-139-generic);
#      something narrower than domain=17 may be required. Not root-caused
#      further since it doesn't change this rule's own conclusion --
#      revisit only if this rule needs to fire in an environment where
#      AF_INET/AF_INET6 SOCK_RAW is actually creatable.
# Net effect: this rule is kept as defense-in-depth for any environment
# where AF_INET/AF_INET6 SOCK_RAW is actually creatable (root, or ambient
# CAP_NET_RAW explicitly granted) but could NOT be live-fire-verified in
# this repo's own container, since it runs non-root without ambient caps
# and the attack precondition itself never holds here -- same category as
# the "Contact cloud metadata service" rule's documented untestable-here
# status, not an open bug to keep chasing.
- rule: Raw INET socket creation attempt in claude-code
  desc: >
    A process inside claude-code created an AF_INET/AF_INET6 SOCK_RAW
    socket -- lets a process craft raw IP packets (custom ICMP, spoofed
    source addresses, protocol scanning) entirely below the domain-
    allowlist model the egress-proxy enforces. AF_PACKET raw sockets are
    already caught by Falco's own bundled "Packet socket created in
    container" rule (confirmed live 2026-09-15, though it fires on the
    attempt, not confirmed success -- see comment above). Confirmed
    2026-09-15 that claude-code's non-root, no-ambient-capabilities setup
    already blocks creation of BOTH AF_PACKET and AF_INET/AF_INET6
    SOCK_RAW sockets here regardless of Falco (see comment above) -- this
    rule is defense-in-depth for configurations where that isn't true, not
    a closed, live-fire-verified detection here.
  condition: >
    claude_code_container
    and evt.type = socket
    and evt.dir = <
    and evt.arg.domain in (2, AF_INET, PF_INET, 10, AF_INET6, PF_INET6)
    and (evt.arg.type = 3 or evt.arg.type = 524291)
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Raw INET socket creation attempt in claude-code
    (args=%evt.args command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, network, defense-evasion]

# Added 2026-09-15 (see OPEN ITEMS "Candidate future rules" -- next item
# after the raw-socket rule above). Applying the capability lesson from
# that rule UP FRONT this time instead of discovering it after a round of
# live-testing: mount()/umount2() require CAP_SYS_ADMIN (kernel-side
# ns_capable(CAP_SYS_ADMIN) check). claude-code's docker-compose.yml
# service has no cap_add/cap_drop/security_opt at all, so it only gets
# Docker's default capability set -- confirmed via the raw-socket
# investigation's live `CapBnd` reading (00000000a80425fb, which sums
# exactly to Docker's default 14 capabilities: CHOWN, DAC_OVERRIDE,
# FOWNER, FSETID, KILL, SETGID, SETUID, SETPCAP, NET_BIND_SERVICE,
# NET_RAW, SYS_CHROOT, MKNOD, AUDIT_WRITE, SETFCAP). CAP_SYS_ADMIN is NOT
# in that set at all -- unlike CAP_NET_RAW, which was present in the
# bounding set but merely unusable by this non-root process. So
# mount()/umount2() should fail here even more definitively than the raw
# socket attempts did (capability entirely absent, not just
# present-but-unusable). Written as a pure attempt-detector from the
# start (matches the "Process memory access attempt" ptrace rule's
# design, including reusing plain %evt.args in the output instead of
# named evt.arg.NAME fields, to avoid the exact field-guessing problems
# the raw-socket rule ran into) -- this rule's value is in detecting the
# attempt, not in assuming it could succeed.
#
# LIVE-VERIFIED 2026-09-15: the capability prediction was confirmed on a
# real Docker/eBPF host -- a single process printed errno right after each
# syscall, `mount()` and `umount2()` both returned
# `ret=-1 errno=1 (Operation not permitted)`, exactly the
# CAP_SYS_ADMIN-absent EPERM predicted above. Falco visibility was
# initially the opposite of expected, though: on Falco 0.39.2 this failing
# syscall wasn't surfaced to rule evaluation at all (confirmed via a
# maximally broad debug rule, not just this specific test). RESOLVED by
# upgrading security-monitor's base image to Falco 0.44.1 (see the SECOND
# CONSOLIDATED FINDING near the top of this file's OPEN ITEMS block for
# the full writeup) -- this rule now fires correctly and
# tests/security/test_falco_rules.sh's test_mount_attempt_fires is a hard
# assertion, not a soft-skip.
- rule: Mount or unmount attempt in claude-code
  desc: >
    A process inside claude-code attempted to mount or unmount a
    filesystem. The read-only mounts in this repo (workspace
    .squid-claudecode-docker override, the Squid policy itself) are a
    core security boundary -- a successful mount/umount2 here could
    remount them read-write or unmount them entirely, bypassing every
    file-based rule that assumes they stay read-only. claude-code lacks
    CAP_SYS_ADMIN (see comment above), so this attempt is expected to
    fail, but the attempt itself is the signal, not success.
  condition: >
    claude_code_container
    and evt.dir = <
    and evt.type in (mount, umount2)
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Mount or unmount attempt in claude-code
    (type=%evt.type args=%evt.args command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, filesystem, defense-evasion]

# Added 2026-09-15, after researching how Falco's own upstream rules
# handle this: neither the default falco_rules.yaml nor the community
# falco-incubating_rules.yaml (checked against the falcosecurity/rules
# repo directly) hook the raw `mount` syscall at all. Falco's own official
# rule for this exact scenario, "Mount Launched in Privileged Container"
# (falco-incubating_rules.yaml), deliberately avoids it:
#   condition: spawned_process and container and container.privileged=true
#     and proc.name=mount and not mount_info and ...
# It detects EXECUTION of the mount/umount binaries via spawned_process
# (the most reliably-instrumented event type in this whole file) instead
# of hooking mount()/umount2() directly -- independent, external
# validation of the same pivot this project made for memfd_create/
# execveat (detect the process, not the rare syscall).
#
# LIVE-VERIFIED 2026-09-15 that this pivot did NOT resolve the gap on
# Falco 0.39.2, surprisingly -- /usr/bin/mount and /usr/bin/umount
# executed successfully (real mount-table output, exit 0) but produced no
# event of any kind, not even from a maximally broad debug rule matching
# every spawned_process with zero filters. The obvious alternative
# hypothesis -- both binaries are setuid-root, maybe setuid exec
# transitions aren't captured on this build -- was tested and DISPROVEN:
# `/usr/bin/su` (also setuid-root) fired the existing "Privilege
# escalation attempt" rule perfectly reliably in the same session. So this
# wasn't a general "setuid execs are invisible" gap either.
#
# CORRECTION 2026-09-15: initially (wrongly) marked resolved by the Falco
# 0.39.2 -> 0.44.1 upgrade, by analogy with the syscall-level sibling rule
# above (which the upgrade DID fix). Re-tested properly and it's still
# broken on 0.44.1 -- and the "setuid disproven" control from the
# paragraph above no longer holds on this version either: `su --help`
# (both direct `docker compose exec claude-code su --help` and
# `sh -c 'su --help'`) now ALSO produces no event for its own execve, only
# for the `sh -c ...` wrapper process when one is used -- the same
# `Privilege escalation attempt` rule that fired reliably for `su` on
# 0.39.2 does not fire for it on 0.44.1.
#
# ROOT-CAUSED (with real confidence this time, not just "unexplained"):
# confirmed this is a general SETUID-EXECVE gap, not specific to
# mount/umount/su -- a fourth, unrelated setuid-root binary (`chsh`,
# neither mount/umount/su-adjacent nor previously tested) reproduces the
# exact same silence, while every non-setuid execve tested throughout this
# whole session (python3, bash, sh, node, rtk, dash, etc.) is captured
# fine. Traced to a specific, real Falco architecture change:
# falcosecurity/libs#2726 ("default to `sched_process_exec` tracepoint on
# all architectures", merged 2025-12-04) switched how *successful*
# execve/execveat events are generated -- via the kernel's
# `sched_process_exec` tracepoint -- while *failing* calls still use the
# older dedicated syscall-exit fillers. This exactly matches every result
# in this file: mount()/umount2()/unshare()/capset() as raw syscalls all
# FAIL here (confirmed via direct errno checks) and go through the
# still-working failing-call path (all fire correctly); mount/umount/su/
# chsh as BINARIES all SUCCEED at execve (regardless of what they do
# internally) and go through the new sched_process_exec path -- which
# apparently doesn't generate an event when that successful exec also
# completes a setuid credential transition. Not confirmed against Falco's
# own issue tracker (no existing report found for this exact combination)
# -- worth filing upstream against falcosecurity/libs#2726 with the
# `chsh`/`su` repro above. Also does not affect ptrace's own test since
# PID-1 ptrace is a failing call, same reasoning.
#
# Ruled out separately: container-plugin interference (a maximally broad
# debug rule scoped by `user.name = claudecode` alone, with NO
# `container.id` check at all, still caught nothing for su/mount/chsh) --
# this is not about container enrichment, the raw event genuinely isn't
# generated. Raising Falco's own `log_level` to `debug` produced no
# additional diagnostic output either, on both 0.39.2 and 0.44.1.
#
# tests/security/test_falco_rules.sh's test_mount_binary_execution_fires
# and test_privilege_escalation_attempt's `su` case are soft-skips
# pending an upstream fix -- see their own comments.
- rule: Mount or umount binary executed in claude-code
  desc: >
    The mount or umount command-line utility was executed inside
    claude-code. Same underlying concern as "Mount or unmount attempt in
    claude-code" above (the read-only mounts in this repo are a core
    security boundary) -- detected here via process execution instead of
    the raw syscall, following the same pattern Falco's own official
    "Mount Launched in Privileged Container" rule uses.
  condition: >
    spawned_process
    and claude_code_container
    and proc.name in (mount, umount)
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Mount or umount binary executed in claude-code
    (command=%proc.cmdline parent=%proc.pname user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, filesystem, defense-evasion]

# Added 2026-09-15 (see OPEN ITEMS "Candidate future rules" -- next item
# after mount/umount2 above). Unlike the previous two items,
# unshare(CLONE_NEWUSER) is explicitly *unprivileged by design* -- it
# needs no existing capability, so the "claude-code lacks CAP_X" reasoning
# that closed the raw-socket and mount items does not apply here (see the
# OPEN ITEMS preamble's own note about this exception). This made it a
# genuinely open question, resolved live BEFORE writing this rule (not
# guessed, per the lesson from the raw-socket item):
#
# LIVE-VERIFIED 2026-09-15: `unshare(CLONE_NEWUSER)` fails with EPERM in
# claude-code. Root-caused with a controlled A/B test (identical kernel,
# only the container's seccomp setting changed): a plain `python:3-slim`
# container with Docker's default seccomp profile got
# `ret=-1 errno=1 (EPERM)`; the same container with
# `--security-opt seccomp=unconfined` got `ret=0` (success). The two
# classic alternate explanations were checked and ruled out first: the
# kernel's own gate, `/proc/sys/kernel/unprivileged_userns_clone`, is `1`
# (allowed) both on the host and inside the container, and no AppArmor
# denial appeared in `dmesg`/`journalctl -k` (AppArmor denials are
# normally logged even in enforce mode, unlike a silent seccomp
# SCMP_ACT_ERRNO, which matches the complete absence of any log trace
# here). Conclusion: Docker's own default seccomp profile blocks
# `unshare`/`clone` with `CLONE_NEWUSER` unless the container has
# CAP_SYS_ADMIN (a known upstream hardening, moby/moby#34787) --
# claude-code doesn't have it (confirmed in the mount/umount2 rule's own
# comment above), so this specific escape primitive is already closed
# here by Docker's defaults, independent of anything this project
# configures. This rule is defense-in-depth for configurations that
# might disable/replace the default seccomp profile, not a closed gap
# today.
#
# Initially found silent on Falco 0.39.2 despite the above (same "rare
# syscall not captured" gap as mount/umount2/capset) -- RESOLVED by the
# 0.39.2 -> 0.44.1 upgrade documented in the SECOND CONSOLIDATED FINDING
# near the top of this file's OPEN ITEMS block. Fires correctly now.
#
# Condition deliberately does NOT try to match the `clone` syscall or any
# CLONE_NEWUSER flag value: `clone()` is extremely common (every
# Bun/Node thread uses it) and its flags argument would hit the exact
# same "guess the numeric encoding" trap that cost multiple live-test
# rounds on the raw-socket rule (see that rule's comment). `unshare()` on
# its own, by contrast, is rare enough for a Node/Bun/Python-based
# process that alerting on ANY call to it (no flag filtering, matching
# the ptrace/mount rules' own precedent of not filtering on target/path)
# should carry negligible false-positive risk. `clone(CLONE_NEWUSER,
# ...)` (creating the namespace via clone() directly instead of a
# separate unshare() call) is a known, deliberately accepted gap this
# rule does not cover.
- rule: Unshare attempt in claude-code
  desc: >
    A process inside claude-code called unshare() -- most commonly used
    to create a new user namespace (CLONE_NEWUSER), the classic
    unprivileged-escalation primitive (map self to UID 0 inside the new
    namespace). Docker's default seccomp profile blocks this without
    CAP_SYS_ADMIN, which claude-code doesn't have, so this is expected to
    fail here -- the attempt itself is the signal, not success.
  condition: >
    claude_code_container
    and evt.dir = <
    and evt.type = unshare
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Unshare attempt in claude-code
    (args=%evt.args command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, defense-evasion, privilege-escalation]

# Added 2026-09-15, companion to the unshare rule above: covers the
# follow-up step of the same escape technique (writing "0 <uid> 1" to
# /proc/self/uid_map maps the calling process to UID 0 inside a
# successfully created user namespace) so the chain is still watched even
# if unshare() ever succeeds in some other configuration where this
# rule's sibling didn't fire, or vice versa. Modeled on the proven
# pattern from "Write attempt to workspace Squid override in claude-code"
# above (write-intent flags + fd.name via `contains`, immune to the
# `/proc/self/` magic-link prefix per that rule's own writeup) --
# expected to work the same way here since both are "open with
# write-intent flags against a specific path" detections.
#
# LIVE-VERIFIED 2026-09-15 that it did NOT fire on Falco 0.39.2, however:
# `echo "0 1000 1" > /proc/self/uid_map` produced a real, distinct failure
# (shell reported "I/O error", i.e. EIO -- not EPERM/EINVAL as guessed)
# but neither this rule nor even a maximally broad throwaway debug rule
# matching ANY open/openat/openat2 exit event in the container caught
# anything at all for it. Unlike the Squid override path (a real file on
# a read-only bind mount), /proc/*/uid_map is a synthetic, kernel-generated
# file with its own open/write handlers (proc_uid_map_operations, not the
# regular VFS path) -- plausibly related to whatever the underlying gap
# was.
#
# RESOLVED 2026-09-15 by the Falco 0.39.2 -> 0.44.1 upgrade (see SECOND
# CONSOLIDATED FINDING near the top of this file's OPEN ITEMS block) --
# this rule now fires correctly, same as its unshare sibling above;
# tests/security/test_falco_rules.sh's test_uid_map_write_attempt_fires is
# a hard assertion again, not a soft-skip.
- rule: Write attempt to uid_map or setgroups in claude-code
  desc: >
    A process inside claude-code attempted to write to its own
    /proc/*/uid_map or /proc/*/setgroups -- the step that actually maps a
    process to UID 0 inside a new user namespace, completing the
    unshare(CLONE_NEWUSER) escalation chain. Alerts regardless of whether
    the write succeeds.
  condition: >
    claude_code_container
    and evt.type in (open, openat, openat2)
    and evt.dir = <
    and (evt.args contains "O_WRONLY" or evt.args contains "O_RDWR" or evt.args contains "O_CREAT" or evt.args contains "O_TRUNC")
    and (fd.name contains "/uid_map" or fd.name contains "/setgroups")
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Write attempt to uid_map or setgroups in claude-code
    (file=%fd.name result=%evt.rawres command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, filesystem, privilege-escalation]

# Added 2026-09-15 (see OPEN ITEMS "Candidate future rules" -- next item
# after unshare above). Applying the capability lesson up front again:
# capset() can only ADD a capability to a process's effective/permitted
# set if that capability is already in its permitted set (or the process
# has CAP_SETPCAP to raise from its bounding set) -- CAP_SETPCAP is one
# of Docker's default 14 capabilities, so it sits in claude-code's
# capability BOUNDING set, but (same reasoning as CAP_NET_RAW for the
# raw-socket rule) is not usable by this non-root, no-ambient-capability
# process: CapEff/CapPrm are both empty here (confirmed live during the
# raw-socket investigation), so any capset() call trying to add a
# capability not already effective/permitted -- i.e. any capability at
# all, since none are -- is expected to fail with EPERM. Not yet
# separately live-confirmed for capset specifically (unlike mount/unshare
# above, this one wasn't individually errno-checked before writing this
# comment) -- if it turns out to behave differently, that's worth
# revisiting.
#
# Written as a pure attempt-detector (matches ptrace/mount/unshare
# above), reusing plain %evt.args rather than named fields.
#
# RESOLVED 2026-09-15: the "genuine driver limitation" this comment
# originally worried about (mount, umount2, unshare, capset all silent on
# Falco 0.39.2, only ptrace captured) turned out to be a version-specific
# gap, not a fundamental one -- see the "FOLLOW-UP RESEARCH" note near the
# top of this OPEN ITEMS block. Upgrading the security-monitor base image
# from the retired falcosecurity/falco-no-driver:latest (stuck on 0.39.2
# since ~Nov 2024) to falcosecurity/falco:latest-debian (0.44.1 as of this
# date) made ALL FOUR fire correctly on the very first live test.
#
# That same upgrade immediately surfaced a real false positive here,
# though: `runc` itself calls capset() internally as part of its own
# container-lifecycle process setup (confirmed live --
# `command=runc:[1:CHILD] init`) -- and does so on EVERY `docker compose
# exec` into the container, not just at container start, since each exec
# spawns a fresh runc child. Excluded via `proc.name startswith "runc:"`
# (runc labels these internal re-exec stages "runc:[0:PARENT]",
# "runc:[1:CHILD]", "runc:[2:INIT]", etc. -- matching the prefix covers
# all of them without needing the exact stage label).
- rule: Capset attempt in claude-code
  desc: >
    A process inside claude-code called capset() -- attempting to modify
    its own capability sets. A UID-1000 process with empty
    effective/permitted capability sets has no legitimate reason to ever
    call this (it can only fail or no-op); a real attempt is a strong
    privilege-escalation signal regardless of outcome. Excludes runc's own
    internal capset() calls during container/exec setup (see comment
    above), which are normal container-runtime activity, not an attack.
  condition: >
    claude_code_container
    and evt.dir = <
    and evt.type = capset
    and not proc.name startswith "runc:"
    and not (claude_code_binary_exepath or node_binary_exepath)
  output: >
    Capset attempt in claude-code
    (args=%evt.args command=%proc.cmdline user=%user.name container=%container.id)
  priority: CRITICAL
  tags: [claude-code, privilege-escalation, defense-evasion]
