# RESOLVED 2026-09-15: it was a version-specific Falco gap after all, not
# a permanent driver limitation. The security-monitor base image had been
# stuck on Falco 0.39.2 since ~Nov 2024 -- Dockerfile.security-monitor
# referenced `falcosecurity/falco-no-driver:latest`, which turned out to
# be a RETIRED image name (falcosecurity/falco's own docker/README.md,
# commit a2122621 2024-10-30, describes the current falco-debian image as
# "similar to the OLD falcosecurity/falco-no-driver image") that stopped
# receiving updates, so `:latest` never actually advanced. Switching to
# `falcosecurity/falco:latest-debian` (0.44.1 as of this date) made
# mount/umount2/unshare/capset ALL fire correctly on the first live test
# after the upgrade, no rule changes needed for the capture gap itself.
# Root cause within Falco was never pinned down precisely (plausibly
# related to the "drop syscall enter events" work tracked in
# falcosecurity/libs#2427/#2588/#2607, given 0.44.1's startup log
# explicitly warns `evt.dir = <` is now meaningless "due to the drop of
# enter events" -- consistent with mount/umount2/unshare/capset's exit
# events possibly not having been fully backfilled with enter-event
# parameters yet on 0.39.2) -- not confirmed against Falco's source, and
# no longer worth chasing now that upgrading fixed it outright.
#
# The version jump surfaced three real regressions of its own:
#   1. `runc` calls capset() internally on every `docker compose exec`
#      (not just container start), which the "Capset attempt in
#      claude-code" rule below now excludes via
#      `proc.name startswith "runc:"`. Fixed same-day.
#   2. Falco's bundled ruleset gained its own "PTRACE attached to process"
#      rule (covers PTRACE_ATTACH/SEIZE/POKETEXT/POKEDATA/SETREGS
#      specifically) between 0.39.2 and 0.44.1, which now wins the
#      first-match race for those specific ptrace requests -- "Process
#      memory access attempt in claude-code" below still adds value for
#      the ptrace requests that rule doesn't cover (PTRACE_PEEKTEXT/
#      PEEKDATA, the actual memory-*read* requests used for pure
#      credential exfiltration) plus process_vm_readv/process_vm_writev
#      entirely; see that rule's own comment and its test's trigger
#      choice. Fixed same-day by changing the test's trigger, not the
#      rule.
#   3. NOT fixed, still open, but ROOT-CAUSED: successful execve of ANY
#      setuid-transitioning binary produces no event at all on 0.44.1 --
#      confirmed generally, not just for mount/umount/su, via a fourth
#      unrelated setuid-root binary (`chsh`) reproducing the identical
#      silence. Traced to falcosecurity/libs#2726 (merged 2025-12-04),
#      which moved *successful* execve/execveat capture to the kernel's
#      `sched_process_exec` tracepoint while failing calls still use the
#      older syscall-exit fillers -- apparently the new tracepoint path
#      doesn't generate an event when the successful exec also completes
#      a setuid credential transition. This is a different, newly-
#      discovered gap from the 0.39.2 one (which this upgrade otherwise
#      fixed) -- see "Mount or umount binary executed in claude-code"
#      below for the full writeup, the ruled-out alternatives (container-
#      plugin interference), and current soft-skip status.
#
# FOLLOW-UP RESEARCH, 2026-09-15 (kept for context, largely superseded by
# the resolution above): checked Falco's own public rules
