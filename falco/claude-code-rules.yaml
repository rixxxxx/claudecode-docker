#     not the mount() syscall. Independent, external validation of the
#     exact pivot this project made for memfd_create/execveat (detect the
#     reliable execve event, not the rare syscall) -- see the
#     "Mount or umount binary executed in claude-code" rule below, added
#     to mirror this official pattern. This complements (not replaces)
#     the syscall-level rule, since the two rules cover different attack
