# Known, deliberately NOT closed (see AGENTS.md "Runtime monitoring" for
# the fuller writeup of why these are accepted limits, not bugs):
#   - Bash builtins (history -c, unset HISTFILE typed into an already-open
#     shell) never execve, invisible to every rule here.
#   - curl/wget excluded from the npm-install network-tool check on
#     purpose (upstream's own choice, avoids flagging normal installs).
#   - Exfiltration over an already-allowlisted domain via an
#     unremarkable-looking tool is invisible to every rule in this file.
#   - A reverse shell that never execve's a new binary (raw socket from
#     within an existing process) won't trigger any spawned_process rule.
#   - npm_package_install_ancestor only checks 5 ancestor levels
#     (proc.aname[2..5]).
#
# Candidate future rules, not yet designed (syscall-level attack-chain gap
# analysis, 2026-09-14 -- unlike the "deliberately NOT closed" list above,
# these are NOT accepted limits, just not built yet). Written 2026-09-14:
# claude-code has no `cap_drop` and no `security_opt: no-new-privileges` in
# docker-compose.yml, so it retains Docker's full default capability set
# (including CAP_NET_RAW) in its BOUNDING set -- originally read as making
# the raw-socket item below "concretely exploitable today, not
# theoretical". CORRECTED 2026-09-15 (see that item's own writeup below):
# this reasoning missed that claude-code runs as non-root (UID 1000, no
# ambient capabilities, no file capabilities on any binary) -- a Docker
# default capability sitting in the bounding set is NOT usable by a
# non-root process without ambient propagation or file caps, confirmed
# live via `/proc/self/status` showing CapEff=0000000000000000 for every
# exec'd process in this container regardless of what CapBnd contains.
# This capability-usability gap is specific to CAP_NET_RAW/raw sockets in
# this list -- it does not automatically apply to other items below
# (e.g. unshare(CLONE_NEWUSER) and capset are unprivileged-by-design
# operations that don't need an existing capability to attempt).
