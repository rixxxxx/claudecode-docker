http_port 3128

visible_hostname egress-proxy

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Domain allowlist: this repo's defaults (.squid/) plus, if present, the
# target workspace's own additions (see README.md "Extending the domain
# allowlist"). Both are additive to the same allowed_domains acl.
include /etc/squid/conf.d/defaults/*.conf
include /etc/squid/conf.d/workspace/*.conf

http_access allow allowed_domains
http_access deny all

cache deny all
