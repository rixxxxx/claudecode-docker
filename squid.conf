# The http_port listener declaration itself is included, not static here
# (2026-09-18, see README "TLS interception" / AGENTS.md "SSL Bump
# support") -- default source is .squid-http-port-plain/ (exactly the
# original pre-2026-09-18 "http_port 3128", no SSL Bump capability at all),
# swapped for .squid-http-port-sslbump/ only via
# `bin/cc-container --ssl-bump`. Deliberately NOT made unconditional like
# an earlier version of this file tried: SSL Bump requires OpenSSL support
# actually compiled into Squid, which isn't guaranteed on every base image
# (confirmed missing security_file_certgen on ubuntu/squid:latest during
# this feature's own initial build) -- an unconditional `ssl-bump` option
# here would break the default (non-ssl-bump) path for everyone the moment
# that support isn't present, not just for opt-in users. Keeping the
# listener itself swappable, not just the bump decision, guarantees
# default users get byte-for-byte the original behavior regardless of
# whether SSL Bump works on a given host.
include /etc/squid/conf.d/http-port/*.conf

visible_hostname egress-proxy

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Domain allowlist: this repo's defaults (.squid-claudecode-docker/) plus, if
# present, the target workspace's own additions from its own
# .squid-claudecode-docker/ folder (see README.md "Extending the domain
# allowlist"). Both are additive to the same allowed_domains acl.
include /etc/squid/conf.d/defaults/*.conf
include /etc/squid/conf.d/workspace/*.conf

# SSL Bump (2026-09-18, opt-in -- see bin/generate-bump-ca.sh and README
# "TLS interception"). Domain-only filtering above can't see a request's
# path/query string for HTTPS traffic, since CONNECT is normally tunneled
# opaquely -- bumping decrypts traffic for already-allowed domains only
# (allowed_domains above is unchanged and still the primary gate) so
# path/query-level rules can additionally apply to the decrypted request.
# Positioned here, BEFORE "http_access allow allowed_domains" below,
# because Squid's http_access list is first-match-wins (same rule-ordering
# caveat this repo's own falco/claude-code-rules.yaml calls out for its own
# rules) -- a url-level deny added by this include needs to fire before
# the domain-level allow would otherwise let the request through.
#
# Entirely self-contained in the included fragment (acl step1/ssl_bump
# peek/bump/splice, not just the bump-vs-splice decision) -- same reasoning
# as the http-port include above: the .squid-empty default here means
# ZERO ssl_bump-related directives exist at all for a default user, not
# just an inert "splice everything" rule, so a host where Squid's ssl_bump
# support itself doesn't work can't be affected by this include existing.
# Real bumping only starts once SQUID_SSLBUMP_DIR points at
# .squid-sslbump-enabled instead (bin/cc-container --ssl-bump), which also
# needs SQUID_HTTP_PORT_DIR/SQUID_BUMP_CA_DIR switched together (see
# docker-compose.yml) -- .squid-sslbump-enabled/10-bump.conf itself
# documents that dependency.
include /etc/squid/conf.d/sslbump/*.conf

http_access allow allowed_domains
http_access deny all

cache deny all

# Enterprise proxy chaining (see README "Enterprise proxy support"):
# rendered by bin/cc-container from HTTP_PROXY/HTTPS_PROXY in .env. Empty
# (no-op, direct internet access) unless an enterprise proxy is configured,
# in which case it adds a cache_peer + never_direct directive here.
include /etc/squid/conf.d/upstream/*.conf
