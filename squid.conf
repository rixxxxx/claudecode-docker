http_port 3128

# Kern: Authentifizierung & API
acl allowed_domains dstdomain api.anthropic.com
acl allowed_domains dstdomain claude.ai
acl allowed_domains dstdomain claude.com
acl allowed_domains dstdomain platform.claude.com

# Plugins, MCP, Downloads (optional, je nach Nutzung)
acl allowed_domains dstdomain mcp-proxy.anthropic.com
acl allowed_domains dstdomain downloads.claude.ai
acl allowed_domains dstdomain storage.googleapis.com

# npm
acl allowed_domains dstdomain registry.npmjs.org

# GitHub (Release-Notes-Feed + gh CLI)
acl allowed_domains dstdomain raw.githubusercontent.com
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain api.github.com
acl allowed_domains dstdomain cli.github.com
acl allowed_domains dstdomain .githubusercontent.com

# NodeSource (für den Build, nicht zur Laufzeit relevant, aber schadet nicht)
acl allowed_domains dstdomain deb.nodesource.com

# Dokumentations-Lookups des claude-code-guide-Agents (optional)
acl allowed_domains dstdomain code.claude.com

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

cache deny all
