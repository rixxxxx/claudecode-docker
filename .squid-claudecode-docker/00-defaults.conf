# Algolia DocSearch (2026-09-18) -- react.dev/vuejs.org/angular.dev/kubernetes.io's
# own search is a client-side widget that queries Algolia's API on a
# DIFFERENT domain, not a /search page on their own domain (confirmed live
# for angular.dev: request goes to l1xwt2uj7f-3.algolianet.com). Without
# this, their search silently returns nothing even though the site itself
# loads fine. Path-restricted to just the query endpoint in
# .squid-sslbump-enabled/20-search-only.conf (opt-in, SSL-Bump only) --
# domain-level allow here is unconditional, matching how every other entry
# in this file works regardless of SSL Bump.
acl allowed_domains dstdomain .algolia.net
acl allowed_domains dstdomain .algolianet.com

# Databases
acl allowed_domains dstdomain .postgresql.org
acl allowed_domains dstdomain .dev.mysql.com
acl allowed_domains dstdomain .redis.io

