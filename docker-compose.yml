services:
  claude-code:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: claude-code:latest
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    volumes:
      - ${HOST_WORKSPACE:-.}:/workspace
      # Optional: reuse OAuth credentials from the host
      # - ${HOME}/.claude:/home/claudecode/.claude
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    networks:
      - internal
    depends_on:
      egress-proxy:
        condition: service_healthy
    restart: unless-stopped

  egress-proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - internal
      - external
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge
    internal: true   # critical: no default gateway to the internet
  external:
    driver: bridge
