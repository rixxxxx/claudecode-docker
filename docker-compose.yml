services:
  claude-code:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE:-unknown}
      # Enterprise proxy support (see README "Enterprise proxy support"):
      # only affects build-time RUN steps (apt/curl/npm/gh/rtk), via BuildKit
      # secret mounts in the Dockerfile -- not build.args, which (like ARG)
      # would persist a corporate proxy password in `docker history`. Runtime
      # HTTP_PROXY/HTTPS_PROXY for the running container are set below under
      # `environment:` and point at egress-proxy instead; unrelated to this.
      secrets:
        - http_proxy
        - https_proxy
        - no_proxy
    image: claude-code:latest
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    volumes:
      - ${HOST_WORKSPACE:-.}:/workspace
      # Shadow the workspace's own .squid-claudecode-docker/ with a read-only
      # mount so the agent running in here can't rewrite the network
      # policy egress-proxy reads from the same host directory (see
      # AGENTS.md).
      - ${SQUID_WORKSPACE_DIR:-./.squid-empty}:/workspace/.squid-claudecode-docker:ro
      # Optional: reuse OAuth credentials from the host
      # - ${HOME}/.claude:/home/claudecode/.claude
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    networks:
      - internal
    depends_on:
      egress-proxy:
        condition: service_healthy
      # security-monitor/stop-watcher only exist at all when their
      # profiles ("monitoring"/"auto-stop", see those services below) are
      # active -- required: false tells Compose to silently skip this
      # dependency rather than error out ("service claude-code depends on
      # undefined service ...") when a profile isn't in play, e.g. a plain
      # `docker compose up -d` or `cc-container` without --monitor. When
      # the profile IS active, claude-code still waits for the real
      # service_healthy condition below, same as egress-proxy above.
      security-monitor:
        condition: service_healthy
        required: false
      stop-watcher:
        condition: service_healthy
        required: false
    restart: unless-stopped

  egress-proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./.squid-claudecode-docker:/etc/squid/conf.d/defaults:ro
      - ${SQUID_WORKSPACE_DIR:-./.squid-empty}:/etc/squid/conf.d/workspace:ro
      # Enterprise proxy chaining: rendered by bin/cc-container from
      # HTTP_PROXY/HTTPS_PROXY in .env (see README "Enterprise proxy
      # support"). No-op include when no enterprise proxy is configured.
      # Falls back to the same tracked, always-present .squid-empty/
      # placeholder as SQUID_WORKSPACE_DIR below when SQUID_UPSTREAM_PROXY_DIR
      # isn't exported (e.g. docker compose invoked directly, bypassing
      # cc-container) -- an empty/missing directory here can otherwise make
      # Squid's include match zero files and fail to start.
      - ${SQUID_UPSTREAM_PROXY_DIR:-./.squid-empty}:/etc/squid/conf.d/upstream:ro
    networks:
      - internal
      - external
      - proxy-chain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # NTLM/Kerberos relay for the corporate proxy, via px. Only needed (and
  # only started, via the "enterprise-proxy" Compose profile) when
  # ENTERPRISE_PROXY_AUTH is ntlm or kerberos — Basic auth is handled by
  # Squid's own cache_peer login= directly, no sidecar required. See
  # README "Enterprise proxy support" and AGENTS.md.
  proxy-auth:
    build:
      context: .
      dockerfile: Dockerfile.proxy-auth
      secrets:
        - http_proxy
        - https_proxy
        - no_proxy
    image: claude-code-proxy-auth:latest
    profiles:
      - enterprise-proxy
    volumes:
      - ./.squid-upstream-proxy/px.ini:/etc/px/px.ini:ro
      - ./.squid-upstream-proxy/px.env:/etc/px/px.env:ro
      - ${KRB5_CCNAME_PATH:-/dev/null}:/tmp/krb5cc:ro
      - ${KRB5_CONFIG_PATH:-/dev/null}:/etc/krb5.conf:ro
    networks:
      - proxy-chain
      - external
    restart: unless-stopped

  # Optional runtime security monitoring (eBPF-based syscall observation
  # via Falco -- see AGENTS.md "Runtime monitoring" and README "Runtime
  # monitoring (optional)"). Never started by default -- only via the
  # "monitoring" Compose profile (`cc-container --monitor` or
  # `docker compose --profile monitoring up -d`). Watches the host kernel
  # from outside claude-code entirely -- claude-code itself gets no
  # additional privileges from this (see AGENTS.md's exception note for
  # exactly what's scoped to this one service).
  #
  # network_mode: none -- deliberately no IP networking at all. Alert
  # delivery goes out via a bind-mounted Unix socket (the host's D-Bus
  # session bus), not over a network; eBPF observes the host kernel
  # directly regardless of this container's own network namespace.
  #
  # VERIFY (no Docker access at authoring time, see
  # Dockerfile.security-monitor): the exact cap_add set needed for Falco's
  # modern eBPF driver without --privileged, and whether network_mode:
  # none is actually compatible with it -- written from documentation
  # knowledge.
  security-monitor:
    build:
      context: .
      dockerfile: Dockerfile.security-monitor
    image: claude-code-security-monitor:latest
    profiles:
      - monitoring
    # Confirmed on a real host (2026-09-11): alerts (stdout_output) were
    # firing correctly the whole time, but glibc block-buffers stdout when
    # it isn't a TTY (which it never is under `docker logs`) -- so every
    # alert sat in Falco's stdio buffer until the buffer filled or the
    # process exited, making `docker logs -f` look dead for
    # minutes even though Falco's own status lines (which go to stderr,
    # always unbuffered) appeared instantly. stdbuf forces line-buffered
    # stdout/stderr so `docker logs -f` actually streams alerts live.
    command: ["stdbuf", "-oL", "-eL", "/usr/bin/falco", "-o", "time_format_iso_8601=true"]
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - DAC_OVERRIDE
    security_opt:
      - apparmor:unconfined
    network_mode: none
    # network_mode: none rules out an HTTP/gRPC probe (falco.yaml also
    # leaves both disabled, see that file); Falco has no docker.sock here
    # either (deliberately, see the service-level comment above) to read
    # its own container logs. pgrep is the honest option left: it only
    # proves the falco process itself hasn't died/crash-looped, not that
    # the eBPF probe attached or rules loaded cleanly -- but it's what
    # `depends_on: security-monitor: condition: service_healthy` on
    # claude-code (see that service) can actually check from outside.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x falco >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      # Host D-Bus session bus, for falco-notify.sh's native desktop
      # notifications (see falco-notify.sh, falco/falco.yaml's
      # program_output). HOST_UID is exported by bin/cc-container ($(id
      # -u) of the invoking host user) -- falls back to 1000 (this repo's
      # own default, non-root UID convention, see Dockerfile) if unset,
      # e.g. when invoking docker compose directly.
      - /run/user/${HOST_UID:-1000}/bus:/run/user/${HOST_UID:-1000}/bus
      # Shared with stop-watcher (see that service below): falco-notify.sh
      # keeps one counter file per offending container id here and writes
      # a trigger.<container_id> file once SECURITY_MONITOR_STOP_THRESHOLD
      # CRITICAL/EMERGENCY alerts for that specific container have fired
      # (see falco-notify.sh); stop-watcher polls the same volume from the
      # other side and stops exactly that container id. Mounted here
      # unconditionally -- harmless if the "auto-stop" profile
      # (stop-watcher) isn't running, the files just sit unread.
      - falco-stop-signal:/var/run/falco-stop
    environment:
      HOST_PROC: /host/proc
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${HOST_UID:-1000}/bus
      # falco-notify.sh needs this to setpriv from root down to the host
      # user who actually owns the D-Bus session bus above -- see
      # Dockerfile.security-monitor's verification note.
      HOST_UID: ${HOST_UID:-1000}
      # On/off switch for the desktop notification popup only (see
      # falco-notify.sh and .env.example) -- resolved from .env by docker
      # compose on the host at up/recreate time, never read from inside
      # claude-code. Alerts keep landing in `docker logs` either way.
      SECURITY_MONITOR_NOTIFY: ${SECURITY_MONITOR_NOTIFY:-true}
      # How long (ms) non-critical popups stay up before auto-closing (see
      # falco-notify.sh and .env.example). Critical/Emergency alerts ignore
      # this and stay until dismissed.
      SECURITY_MONITOR_NOTIFY_TIMEOUT: ${SECURITY_MONITOR_NOTIFY_TIMEOUT:-8000}
      # Number of CRITICAL/EMERGENCY alerts for the SAME container id (see
      # falco/claude-code-rules.yaml, falco-notify.sh) before signaling
      # stop-watcher to stop that specific container -- counted
      # per-container, not globally, so one workspace's alerts never count
      # against a different workspace's claude-code container (Falco's
      # eBPF view spans the whole host kernel, not just one Compose
      # project, see AGENTS.md "Runtime monitoring"). Set to 0 to disable
      # (falco-notify.sh treats 0/negative as "never trigger"). Only has an
      # effect when stop-watcher is also running (the "auto-stop" Compose
      # profile, see that service below) -- without it, alerts still count
      # but nothing acts on the trigger files. Default: 3.
      SECURITY_MONITOR_STOP_THRESHOLD: ${SECURITY_MONITOR_STOP_THRESHOLD:-3}
    restart: unless-stopped

  # Minimal, narrowly-scoped companion to security-monitor: the only thing
  # in this repo with docker.sock access (see AGENTS.md "Runtime
  # monitoring" and tests/security/test_static_hardening.sh, which enforces
  # that this stays the *only* service with it). Stopping a container
  # requires talking to the Docker API from somewhere -- kept out of
  # security-monitor itself deliberately, since that service already runs
  # with cap_add/apparmor:unconfined for eBPF, and adding docker.sock there
  # too would let a single Falco/eBPF compromise pivot into full
  # host-Docker control instead of just this one container's blast radius.
  # This service does exactly one job: watch for trigger.<container_id>
  # files security-monitor writes to the shared falco-stop-signal volume,
  # then -- only after confirming via docker.sock that the named container
  # actually belongs to this same Compose project and is the claude-code
  # service specifically (see stop-watcher-entrypoint.sh) -- stop it. That
  # check matters because security-monitor's eBPF view spans the whole
  # host kernel, not just this one Compose project (see AGENTS.md "Runtime
  # monitoring"), so a trigger file here could in principle name a
  # different workspace's container; the same-project check is what keeps
  # each stop-watcher instance limited to stopping only its own
  # claude-code sibling, never anyone else's. No cap_add, no eBPF, no
  # network (network_mode: none -- docker.sock is a filesystem socket, not
  # a network endpoint, so this doesn't need one either).
  #
  # Separate "auto-stop" Compose profile so a raw `docker compose`
  # invocation (bypassing cc-container) still leaves this off unless asked
  # for explicitly -- but `bin/cc-container`'s `--monitor` handling adds
  # this profile automatically alongside "monitoring" (see main() there),
  # so in practice `cc-container --monitor` starts both together. The only
  # way to skip stop-watcher while still using --monitor is
  # SECURITY_MONITOR_STOP_THRESHOLD=0 in .env, which cc-container checks
  # before adding this profile.
  #
  # VERIFY (no Docker access at authoring time): falco-notify.sh's
  # assumption that Falco resolves container.id without a docker.sock
  # mount (unlike container.name/container.image.repository, already
  # confirmed to need one -- see AGENTS.md); and
  # stop-watcher-entrypoint.sh's /etc/hostname-as-self-id assumption used
  # for the same-Compose-project check above. Both written from
  # documentation knowledge, not confirmed on a live host.
  stop-watcher:
    build:
      context: .
      dockerfile: Dockerfile.stop-watcher
    image: claude-code-stop-watcher:latest
    profiles:
      - auto-stop
    volumes:
      - falco-stop-signal:/var/run/falco-stop
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    # docker.sock is a filesystem socket (see network_mode: none note
    # above), so curl can hit it directly regardless of network namespace.
    # /_ping is the Docker Engine API's own liveness endpoint -- confirms
    # the one thing this service actually depends on (docker.sock being
    # reachable) without needing docker CLI in this minimal Alpine image.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--unix-socket", "/var/run/docker.sock", "http://localhost/_ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  falco-stop-signal:

networks:
  internal:
    driver: bridge
    internal: true   # critical: no default gateway to the internet
  external:
    driver: bridge
  # Security-critical (see AGENTS.md): only egress-proxy and proxy-auth
  # ever join this network. claude-code must never be attached to it —
  # that's what stops the sandbox from reaching proxy-auth directly and
  # bypassing Squid's domain allowlist.
  proxy-chain:
    driver: bridge

# Build-time-only secrets (see "Enterprise proxy support" comment on the
# claude-code service above): file-backed rather than Compose's newer
# `environment:` secret source, since that needs a fairly recent Compose
# version this repo doesn't otherwise require. bin/cc-container's
# render_build_secret_files() renders the real files into
# .squid-upstream-proxy/ (gitignored, never committed) and exports the
# *_SECRET_FILE vars below to point at them. Unlike the SQUID_WORKSPACE_DIR
# directory mount elsewhere in this file, Compose won't auto-create a
# missing secret *file* -- so invoking `docker compose build` directly,
# bypassing cc-container (same caveat AGENTS.md already documents for
# SQUID_WORKSPACE_DIR), falls back to the tracked, always-present, empty
# .squid-empty-secret instead of erroring.
secrets:
  http_proxy:
    file: ${HTTP_PROXY_SECRET_FILE:-./.squid-empty-secret}
  https_proxy:
    file: ${HTTPS_PROXY_SECRET_FILE:-./.squid-empty-secret}
  no_proxy:
    file: ${NO_PROXY_SECRET_FILE:-./.squid-empty-secret}
